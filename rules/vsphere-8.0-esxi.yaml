- id: ESXI-80-000247
  title: The ESXi host must use DOD-approved encryption to protect the confidentiality of network sessions.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000247' do
      title 'The ESXi host must use DOD-approved encryption to protect the confidentiality of network sessions.'
      desc 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information via a remote access session. In ESXi 8.0 Update 3 and newer TLS profiles are available to configure client and server TLS settings and must be configured to use only strong ciphers.'
      desc 'check', 'From an ESXi shell, run the following command:

    # esxcli system tls server get --show-profile-defaults --show-current-boot-profile

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.system.tls.server.get.CreateArgs()
    $arguments.showprofiledefaults = $true
    $arguments.showcurrentbootprofile = $true
    $esxcli.system.tls.server.get.invoke($arguments)

    Example result:

    Profile: NIST_2024
    Cipher List: ECDHE+AESGCM
    Cipher Suite: TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    Groups: prime256v1:secp384r1:secp521r1
    Protocol Versions: tls1.2,tls1.3
    Reboot Required: true

    If the TLS profile is not set to "NIST_2024" or is not the current boot profile, this is a finding.'
      desc 'fix', 'TLS Profiles can be configured with vSphere Configuration Profiles or manually on each host for clusters not using vSphere Configuration Profiles.

    For ESXi hosts in clusters managed with vSphere Configuration Profiles do the following:

    Note: These steps assume a vSphere Configuration Profile is already in use for the target cluster.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the target cluster >> Configure >> Desired State >> Configuration >> Draft.

    Click "Create Draft" or "Import from Host" if a draft does not exist.

    Select system >> tls_server >> Configure Settings.

    Select "NIST_2024" from the drop down for profile and click "Save".

    Click "Apply Changes" and run through the pre-check to enforce the change.

    Note: Updating this setting through a vSphere Configuration Profile will place hosts into maintenance mode and perform a rolling reboot of all hosts in the cluster.

    For standalone hosts or clusters not managed with vSphere Configuration Profiles do the following:

    Prior to changing the TLS profile it is highly recommended to place the host in maintenance mode.

    From an ESXi shell, run the following command:

    # esxcli system tls server set -p NIST_2024

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.system.tls.server.set.CreateArgs()
    $arguments.profile = "NIST_2024"
    $esxcli.system.tls.server.set.invoke($arguments)

    A reboot is required to complete the process of changing profiles.'
      impact 0.5
      tag check_id: 'C-69897r1003576_chk'
      tag severity: 'medium'
      tag gid: 'V-265974'
      tag rid: 'SV-265974r1003578_rule'
      tag stig_id: 'ESXI-80-000247'
      tag gtitle: 'SRG-OS-000033-VMM-000140'
      tag fix_id: 'F-69800r1003577_fix'
      tag cci: ['CCI-000068', 'CCI-002420', 'CCI-002422']
      tag nist: ['AC-17 (2)', 'SC-8 (2)', 'SC-8 (2)']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $arguments = $esxcli.system.tls.server.get.CreateArgs(); $arguments.showcurrentbootprofile = $true; $esxcli.system.tls.server.get.invoke($arguments) | Select-Object -ExpandProperty Profile"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'NIST_2024' }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000247.rb | gid: V-265974 | rid: SV-265974r1003578_rule'
- id: ESXI-80-000248
  title: The ESXi host must disable key persistence.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000248' do
      title 'The ESXi host must disable key persistence.'
      desc 'When using a standard key provider, the ESXi host relies on vCenter Server to manage the encryption keys. When using a trusted key provider, the ESXi host relies directly on the Trust Authority Hosts for keys, and vCenter Server is not involved.

    Regardless of the type of key provider, the ESXi host obtains the keys initially and retains them in its key cache. If the ESXi host reboots, it loses its key cache. The ESXi host then requests the keys again, either from the key server (standard key provider), or the Trust Authority Hosts (trusted key provider). When the ESXi host tries to obtain keys and the key server is offline or unreachable, vTPMs, vSAN encryption, and VM encryption cannot function.

    In vSphere, encrypted workloads can continue to function even when the key server is offline or unreachable. If the ESXi host has a TPM, the encryption keys are persisted in the TPM across reboots. So, even if an ESXi host reboots, the host does not need to request encryption keys. Also, encryption and decryption operations can continue when the key server is unavailable, because the keys have persisted in the TPM.

    If the encryption features of vSphere are used, it is to protect the confidentiality of workloads and while key persistence protects the availability of the environment it does so at the cost of confidentiality. An organization must consider the physical security posture and key provider reliability in their environments and if the risk of physical loss of equipment outweighs the availability of the workloads.'
      desc 'check', 'If the ESXi host does not have a compatible TPM, this is not applicable.

    From an ESXi shell, run the following command:

    # esxcli system security keypersistence get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $esxcli.system.security.keypersistence.get.invoke()

    If key persistence is enabled, this is a finding.'
      desc 'fix', 'From an ESXi shell, run the following command:

    # esxcli system security keypersistence disable --remove-all-stored-keys

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.system.security.keypersistence.disable.CreateArgs()
    $arguments.removeallstoredkeys = $true
    $esxcli.system.security.keypersistence.disable.invoke($arguments)'
      impact 0.5
      tag check_id: 'C-69898r1003579_chk'
      tag severity: 'medium'
      tag gid: 'V-265975'
      tag rid: 'SV-265975r1003581_rule'
      tag stig_id: 'ESXI-80-000248'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
      tag fix_id: 'F-69801r1003580_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $esxcli.system.security.keypersistence.get.invoke() | Select-Object -ExpandProperty Enabled"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'false' }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
