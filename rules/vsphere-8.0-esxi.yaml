- id: ESXI-80-000124
  title: The ESXi host must synchronize internal information system clocks to an authoritative time source.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000124' do
      title 'The ESXi host must synchronize internal information system clocks to an authoritative time source.'
      desc 'To ensure the accuracy of the system clock, it must be synchronized with an authoritative time source within DOD. Many system functions, including time-based logon and activity restrictions, automated reports, system logs, and audit records, depend on an accurate system clock. If there is no confidence in the correctness of the system clock, time-based functions may not operate as intended and records may be of diminished value.'
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Time Configuration.

    Verify NTP or PTP are configured, and one or more authoritative time sources are listed.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Verify the NTP or PTP service is running and configured to start and stop with the host.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    Get-VMHost | Get-VMHostNTPServer
    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "NTP Daemon" -or $_.Label -eq "PTP Daemon"}

    If the NTP service is not configured with authoritative DOD time sources or the service is not configured to start and stop with the host ("Policy" of "on" in PowerCLI) or is stopped, this is a finding.

    If PTP is used instead of NTP, this is not a finding.'
      desc 'fix', 'To configure NTP, perform the following:

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Time Configuration.

    Click "Add Service" and select "Network Time Protocol".

    Enter or update the NTP servers listed with a comma-separated list of authoritative time servers. Click "OK".

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Select the "NTP Daemon" service and click "Edit Startup Policy".

    Select "Start and stop with host". Click "OK".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $NTPServers = "ntpserver1","ntpserver2"
    Get-VMHost | Add-VMHostNTPServer $NTPServers
    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "NTP Daemon"} | Set-VMHostService -Policy On
    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "NTP Daemon"} | Start-VMHostService

    To configure PTP, perform the following:

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Time Configuration.

    Click "Add Service" and select "Precision Time Protocol".

    Select the network adapter that can receive the PTP traffic.

    If NTP servers are available, select "Enable fallback" and enter or update the NTP servers listed with a comma separate list of authoritative time servers. Click "OK".

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Select the "PTP Daemon" service and click "Edit Startup Policy".

    Select "Start and stop with host". Click "OK".'
      impact 0.5
      tag check_id: 'C-62485r933294_chk'
      tag severity: 'medium'
      tag gid: 'V-258745'
      tag rid: 'SV-258745r1003566_rule'
      tag stig_id: 'ESXI-80-000124'
      tag gtitle: 'SRG-OS-000355-VMM-001330'
      tag fix_id: 'F-62394r933295_fix'
      tag satisfies: ['SRG-OS-000355-VMM-001330', 'SRG-OS-000356-VMM-001340']
      tag cci: ['CCI-004923', 'CCI-004926', 'CCI-001891', 'CCI-002046']
      tag nist: ['SC-45 (1) (a)', 'SC-45 (1) (b)', 'AU-8 (1) (a)', 'AU-8 (1) (b)']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "Get-VMHost -Name #{vmhost} | Get-VMHostService | Where {$_.Label -eq 'NTP Daemon'} | Select-Object -ExpandProperty Policy"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'on' }
          end
          command = "Get-VMHost -Name #{vmhost} | Get-VMHostService | Where {$_.Label -eq 'NTP Daemon'} | Select-Object -ExpandProperty Running"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'true' }
          end
          results = powercli_command("Get-VMHost -Name #{vmhost} | Get-VMHostNTPServer").stdout
          if !results.empty?
            results.gsub("\r\n", "\n").split("\n").each do |result|
              describe "NTP Server: #{result} for VMHost: #{vmhost}" do
                subject { result }
                it { should be_in "#{input('esxiNtpServers')}" }
              end
            end
          else
            describe "No NTP servers found on VMhost: #{vmhost}" do
              subject { results }
              it { should_not be_empty }
            end
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000124.rb | gid: V-258745 | rid: SV-258745r1003566_rule'
- id: ESXI-80-000133
  title: The ESXi Image Profile and vSphere Installation Bundle (VIB) acceptance level must be verified.
  cat: 1
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000133' do
      title 'The ESXi Image Profile and vSphere Installation Bundle (VIB) acceptance level must be verified.'
      desc 'Verify the ESXi Image Profile to only allow signed VIBs. An unsigned VIB represents untested code installed on an ESXi host. The ESXi Image profile supports four acceptance levels:

    1. VMwareCertified - VIBs created, tested, and signed by VMware.
    2. VMwareAccepted - VIBs created by a VMware partner but tested and signed by VMware.
    3. PartnerSupported - VIBs created, tested, and signed by a certified VMware partner.
    4. CommunitySupported - VIBs that have not been tested by VMware or a VMware partner.

    Community Supported VIBs are not supported and do not have a digital signature. To protect the security and integrity of ESXi hosts, do not allow unsigned (CommunitySupported) VIBs to be installed on hosts.'
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Host Image Profile Acceptance Level" view the acceptance level.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $esxcli.software.acceptance.get.Invoke()

    If the acceptance level is "CommunitySupported", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Host Image Profile Acceptance Level", click "Edit".

    Using the drop-down selection, set the acceptance level as "VMwareCertified", "VMwareAccepted", or "PartnerSupported". The default is "PartnerSupported".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.software.acceptance.set.CreateArgs()
    $arguments.level = "PartnerSupported"
    $esxcli.software.acceptance.set.Invoke($arguments)

    Note: "VMwareCertified" or "VMwareAccepted" may be substituted for "PartnerSupported", depending on local requirements. These are case sensitive.'
      impact 0.7
      tag check_id: 'C-62486r933297_chk'
      tag severity: 'high'
      tag gid: 'V-258746'
      tag rid: 'SV-258746r1003567_rule'
      tag stig_id: 'ESXI-80-000133'
      tag gtitle: 'SRG-OS-000366-VMM-001430'
      tag fix_id: 'F-62395r933298_fix'
      tag satisfies: ['SRG-OS-000366-VMM-001430', 'SRG-OS-000370-VMM-001460']
      tag cci: ['CCI-003992', 'CCI-001774', 'CCI-001749']
      tag nist: ['CM-14', 'CM-7 (5) (b)', 'CM-5 (3)']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        list = ['PartnerSupported', 'VMwareCertified', 'VMwareAccepted']
        vmhosts.each do |vmhost|
          command = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $esxcli.software.acceptance.get.Invoke()"
          describe powercli_command(command) do
            its('stdout.strip') { should be_in list }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
