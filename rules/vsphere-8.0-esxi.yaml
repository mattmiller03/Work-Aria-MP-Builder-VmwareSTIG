- id: ESXI-80-000008
  title: The ESXi host must enable lockdown mode.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000008' do
      title 'The ESXi host must enable lockdown mode.'
      desc 'Enabling Lockdown Mode disables direct access to an ESXi host, requiring the host to be managed remotely from vCenter Server. This is done to ensure the roles and access controls implemented in vCenter are always enforced and users cannot bypass them by logging on to a host directly.

    By forcing all interaction to occur through vCenter Server, the risk of someone inadvertently attaining elevated privileges or performing tasks that are not properly audited is greatly reduced.'
      desc 'check', 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Scroll down to "Lockdown Mode" and verify it is set to "Enabled" (Normal or Strict).

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Select Name,@{N="Lockdown";E={$_.Extensiondata.Config.LockdownMode}}

    If "Lockdown Mode" is disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile >> Lockdown Mode.

    Click edit and select either the "Normal" or "Strict" radio buttons.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $level = "lockdownNormal" OR "lockdownStrict"
    $vmhost = Get-VMHost -Name <hostname> | Get-View
    $lockdown = Get-View $vmhost.ConfigManager.HostAccessManager
    $lockdown.ChangeLockdownMode($level)

    Note: In strict lockdown mode, the Direct Console User Interface (DCUI) service is stopped. If the connection to vCenter Server is lost and the vSphere Client is no longer available, the ESXi host becomes inaccessible.'
      impact 0.5
      tag check_id: 'C-62470r933249_chk'
      tag severity: 'medium'
      tag gid: 'V-258730'
      tag rid: 'SV-258730r958398_rule'
      tag stig_id: 'ESXI-80-000008'
      tag gtitle: 'SRG-OS-000027-VMM-000080'
      tag fix_id: 'F-62379r933250_fix'
      tag cci: ['CCI-000054']
      tag nist: ['AC-10']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        list = ['lockdownNormal', 'lockdownStrict']
        vmhosts.each do |vmhost|
          command = "(Get-VMHost -Name #{vmhost}).Extensiondata.Config.LockdownMode"
          describe powercli_command(command) do
            its('stdout.strip') { should be_in list }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000008.rb | gid: V-258730 | rid: SV-258730r958398_rule'
- id: ESXI-80-000010
  title: The ESXi host client must be configured with an idle session timeout.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000010' do
      title 'The ESXi host client must be configured with an idle session timeout.'
      desc 'The ESXi host client is the UI served up by the host itself, outside of vCenter. It is accessed at https://<ESX FQDN>/ui. ESXi is not usually administered via this interface for long periods, and all users will be highly privileged. Implementing a mandatory session idle limit will ensure that orphaned, forgotten, or ignored sessions will be closed promptly.'
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "UserVars.HostClientSessionTimeout" value and verify it is set to "900" or less.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-AdvancedSetting -Name UserVars.HostClientSessionTimeout

    If the "UserVars.HostClientSessionTimeout" setting is not set to "900" or less, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "UserVars.HostClientSessionTimeout" value and configure it to "900".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-AdvancedSetting -Name UserVars.HostClientSessionTimeout | Set-AdvancedSetting -Value "900"'
      impact 0.5
      tag check_id: 'C-62471r933252_chk'
      tag severity: 'medium'
      tag gid: 'V-258731'
      tag rid: 'SV-258731r958402_rule'
      tag stig_id: 'ESXI-80-000010'
      tag gtitle: 'SRG-OS-000029-VMM-000100'
      tag fix_id: 'F-62380r933253_fix'
      tag cci: ['CCI-000057']
      tag nist: ['AC-11 a']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "Get-VMHost -Name #{vmhost} | Get-AdvancedSetting -Name UserVars.HostClientSessionTimeout | Select-Object -ExpandProperty Value"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp <= 900 }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000010.rb | gid: V-258731 | rid: SV-258731r958402_rule'
- id: ESXI-80-000014
  title: The ESXi host Secure Shell (SSH) daemon must use FIPS 140-2 validated cryptographic modules to
    protect the confidentiality of remote access sessions.
  cat: 1
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000014' do
      title 'The ESXi host Secure Shell (SSH) daemon must use FIPS 140-2 validated cryptographic modules to protect the confidentiality of remote access sessions.'
      desc 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information via a remote access session.

    OpenSSH on the ESXi host ships with a FIPS 140-2 validated cryptographic module and it is enabled by default. For backward compatibility reasons, this can be disabled so this setting must be audited and corrected if necessary.'
      desc 'check', 'From an ESXi shell, run the following command:

    # esxcli system security fips140 ssh get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $esxcli.system.security.fips140.ssh.get.invoke()

    Expected result:

    Enabled: true

    If the FIPS mode is not enabled for SSH, this is a finding.'
      desc 'fix', 'From an ESXi shell, run the following command:

    # esxcli system security fips140 ssh set -e true

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.system.security.fips140.ssh.set.CreateArgs()
    $arguments.enable = $true
    $esxcli.system.security.fips140.ssh.set.Invoke($arguments)'
      impact 0.7
      tag check_id: 'C-62472r933255_chk'
      tag severity: 'high'
      tag gid: 'V-258732'
      tag rid: 'SV-258732r958408_rule'
      tag stig_id: 'ESXI-80-000014'
      tag gtitle: 'SRG-OS-000033-VMM-000140'
      tag fix_id: 'F-62381r933256_fix'
      tag cci: ['CCI-000068']
      tag nist: ['AC-17 (2)']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $esxcli.system.security.fips140.ssh.get.invoke() | Select-Object -ExpandProperty Enabled"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'true' }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000014.rb | gid: V-258732 | rid: SV-258732r958408_rule'
