- id: ESXI-80-000238
  title: The ESXi host must require TPM-based configuration encryption.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000238' do
      title 'The ESXi host must require TPM-based configuration encryption.'
      desc %q(An ESXi host's configuration consists of configuration files for each service that runs on the host. The configuration files typically reside in the /etc/ directory, but they can also reside in other namespaces. The configuration files contain run-time information about the state of the services. Over time, the default values in the configuration files might change, for example, when settings on the ESXi host are changed.

    A cron job backs up the ESXi configuration files periodically, when ESXi shuts down gracefully or on demand, and creates an archived configuration file in the boot bank. When ESXi reboots, it reads the archived configuration file and recreates the state that ESXi was in when the backup was taken.

    Before vSphere 7.0 Update 2, the archived ESXi configuration file is not encrypted. In vSphere 7.0 Update 2 and later, the archived configuration file is encrypted. When the ESXi host is configured with a Trusted Platform Module (TPM), the TPM is used to "seal" the configuration to the host, providing a strong security guarantee and additional protection from offline attacks.

    Configuration encryption uses the physical TPM when it is available and supported at install or upgrade time. If the TPM was added or enabled later, the ESXi host must be told to reconfigure to use the newly available TPM. Once the TPM configuration encryption is enabled, it cannot be disabled.)
      desc 'check', 'If the ESXi host does not have a compatible TPM, this finding is downgraded to a CAT III.

    From an ESXi shell, run the following command:

    # esxcli system settings encryption get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $esxcli.system.settings.encryption.get.invoke() | Select Mode

    Expected result:

    Mode: TPM

    If the "Mode" is not set to "TPM", this is a finding.'
      desc 'fix', 'Ensure the TPM 2.0 chip is enabled in the BIOS and the ESX UI does not show any errors about a present but unavailable TPM.

    This setting cannot be configured until the TPM is properly enabled in firmware.

    From an ESXi shell, run the following command:

    # esxcli system settings encryption set --mode=TPM

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $arguments = $esxcli.system.settings.encryption.set.CreateArgs()
    $arguments.mode = "TPM"
    $esxcli.system.settings.encryption.set.Invoke($arguments)

    Enter the host into maintenance mode and reboot for changes to take effect.'
      impact 0.5
      tag check_id: 'C-62533r933438_chk'
      tag severity: 'medium'
      tag gid: 'V-258793'
      tag rid: 'SV-258793r959010_rule'
      tag stig_id: 'ESXI-80-000238'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
      tag satisfies: ['SRG-OS-000780-VMM-000240']
      tag fix_id: 'F-62442r933439_fix'
      tag cci: ['CCI-000366', 'CCI-004910']
      tag nist: ['CM-6 b', 'SC-28 (3)']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $esxcli.system.settings.encryption.get.invoke() | Select-Object -ExpandProperty Mode"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'TPM' }
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000238.rb | gid: V-258793 | rid: SV-258793r959010_rule'
- id: ESXI-80-000239
  title: The ESXi host must configure the firewall to restrict access to services running on the host.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000239' do
      title 'The ESXi host must configure the firewall to restrict access to services running on the host.'
      desc 'Unrestricted access to services running on an ESXi host can expose a host to outside attacks and unauthorized access. Reduce the risk by configuring the ESXi firewall to only allow access from authorized networks.'
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Firewall.

    Under the "Allowed IP addresses" column, review the allowed IPs for each service.

    Check this for "Incoming" and "Outgoing" sections.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-VMHostFirewallException | Where {($_.Enabled -eq $true) -and ($_.ExtensionData.IpListUserConfigurable -eq $true)} | Select Name,Enabled,@{N="AllIPEnabled";E={$_.ExtensionData.AllowedHosts.AllIP}},@{N="AllIPUserConfigurable";E={$_.ExtensionData.IpListUserConfigurable}}

    If "Allow connections from any IP address" is configured on a user-configurable enabled service, this is a finding.

    Note: In vSphere 8 U2 firewall rules were categorized as user or system owned for both enabling/disabling and configuring the allowed IP addresses. This control is only applicable for rules in which a user can configure the allowed IP addresses.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Firewall.

    Click "Edit...". For each user-configurable enabled service, uncheck the check box to "Allow connections from any IP address" and input the site-specific network(s) required.

    The following example formats are acceptable:

    192.168.0.0/24
    192.168.1.2, 2001::1/64
    fd3e:29a6:0a81:e478::/64

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    #This disables the allow all rule for the target service. The sshServer service is the target in this example.
    $arguments = $esxcli.network.firewall.ruleset.set.CreateArgs()
    $arguments.rulesetid = "sshServer"
    $arguments.allowedall = $false
    $esxcli.network.firewall.ruleset.set.Invoke($arguments)

    #Next add the allowed IPs for the service. Note that executing the "vSphere Web Client" service this way may disable access but may be done through vCenter or through the console.
    $arguments = $esxcli.network.firewall.ruleset.allowedip.add.CreateArgs()
    $arguments.rulesetid = "sshServer"
    $arguments.ipaddress = "10.0.0.0/8"
    $esxcli.network.firewall.ruleset.allowedip.add.Invoke($arguments)

    This must be done for each user-configurable enabled service.'
      impact 0.5
      tag check_id: 'C-62534r1003541_chk'
      tag severity: 'medium'
      tag gid: 'V-258794'
      tag rid: 'SV-258794r1003574_rule'
      tag stig_id: 'ESXI-80-000239'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
      tag fix_id: 'F-62443r1003542_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          rules = powercli_command("Get-VMHost -Name #{vmhost} | Get-VMHostFirewallException | Where {($_.Enabled -eq $true) -and ($_.ExtensionData.IpListUserConfigurable -eq $true)} | Select-Object -ExpandProperty Name").stdout.gsub("\r\n", "\n").split("\n")
          rules.each do |rule|
            command = "(Get-VMHost -Name #{vmhost} | Get-VMHostFirewallException -Name '#{rule}').ExtensionData.AllowedHosts.AllIP"
            result = powercli_command(command).stdout.strip
            describe "Firewall rule for Service: #{rule} on VMhost: #{vmhost} allow all IPs" do
              subject { result }
              it { should cmp 'False' }
            end
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000239.rb | gid: V-258794 | rid: SV-258794r1003574_rule'
- id: ESXI-80-000240
  title: The ESXi host when using Host Profiles and/or Auto Deploy must use the vSphere Authentication
    Proxy to protect passwords when adding themselves to Active Directory.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000240' do
      title 'The ESXi host when using Host Profiles and/or Auto Deploy must use the vSphere Authentication Proxy to protect passwords when adding themselves to Active Directory.'
      desc 'If a host is configured to join an Active Directory domain using Host Profiles and/or Auto Deploy, the Active Directory credentials are saved in the profile and are transmitted over the network.

    To avoid having to save Active Directory credentials in the Host Profile and to avoid transmitting Active Directory credentials over the network, use the vSphere Authentication Proxy.'
      desc 'check', 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    If the organization is not using Host Profiles to join Active Directory, this is not applicable.

    From the vSphere Client, go to Home >> Policies and Profiles >> Host Profiles.

    Click a Host Profile >> Configure >> Security and Services >> Security Settings >> Authentication Configuration >> Active Directory Configuration >> Join Domain Method.

    If the method used to join hosts to a domain is not set to "Use vSphere Authentication Proxy to add the host to domain", this is a finding.

    or

    From a PowerCLI command prompt while connected to vCenter, run the following command:

    Get-VMHost | Select Name, ` @{N="HostProfile";E={$_ | Get-VMHostProfile}}, ` @{N="JoinADEnabled";E={($_ | Get-VmHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirectory.Enabled}}, ` @{N="JoinDomainMethod";E={(($_ | Get-VMHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirectory | Select -ExpandProperty Policy | Where {$_.Id -eq "JoinDomainMethodPolicy"}).Policyoption.Id}}

    If "JoinADEnabled" is "True" and "JoinDomainMethod" is not "FixedCAMConfigOption", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Home >> Policies and Profiles >> Host Profiles.

    Click a Host Profile >> Configure >> Security and Services >> Security Settings >> Authentication Configuration >> Active Directory Configuration.

    Click "Edit Host Profile...". Set the "Join Domain Method" to "Use vSphere Authentication Proxy to add the host to domain" and provide the IP address of the vSphere Authentication Proxy server.

    Click "Save".'
      impact 0.5
      tag check_id: 'C-62535r933444_chk'
      tag severity: 'medium'
      tag gid: 'V-258795'
      tag rid: 'SV-258795r959010_rule'
      tag stig_id: 'ESXI-80-000240'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
      tag fix_id: 'F-62444r933445_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        setimpact = true
        vmhosts.each do |vmhost|
          command = "Get-VMHost -Name #{vmhost} | Get-VMHostProfile"
          hostprofile = powercli_command(command).stdout

          if hostprofile.empty?
            describe "There are no attached host profiles host: #{vmhost}. This control is not applicable." do
              skip "There are no attached host profiles host: #{vmhost}. This control is not applicable."
            end
          else
            command1 = "(Get-VMHost -Name #{vmhost} | Get-VMHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirectory.Enabled"
            adEnabled = powercli_command(command1).stdout.strip

            if adEnabled.match?('True')
              command2 = "(Get-VMHost -Name #{vmhost} | Get-VMHostProfile).ExtensionData.Config.ApplyProfile.Authentication.ActiveDirectory | Select-Object -ExpandProperty Policy | Where {$_.Id -eq 'JoinDomainMethodPolicy'} | Select-Object -ExpandProperty PolicyOption | Select-Object -ExpandProperty Id"
              describe powercli_command(command2) do
                its('stdout.strip') { should cmp 'FixedCAMConfigOption' }
              end
              setimpact = false
            else
              describe "Active Directory is not enabled on host: #{vmhost}. This control is not applicable." do
                skip "Active Directory is not enabled on host: #{vmhost}. This control is not applicable."
              end
            end
          end
        end
      else
        describe 'No ESXi hosts found. Review inputs provided for errors and rerun profile.' do
          skip 'No ESXi hosts found. Review inputs provided for errors and rerun profile.'
        end
        setimpact = false
      end
      unless !setimpact
        impact 0.0
      end
    end
  notes: 'source: ESXI-80-000240.rb | gid: V-258795 | rid: SV-258795r959010_rule'
- id: ESXI-80-000241
  title: The ESXi host must not use the default Active Directory ESX Admin group.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000241' do
      title 'The ESXi host must not use the default Active Directory ESX Admin group.'
      desc 'When adding ESXi hosts to Active Directory, all user/group accounts assigned to the Active Directory group "ESX Admins" will have full administrative access to the host.

    If this group is not controlled or known to the system administrators, it may be used for inappropriate access to the host. Therefore, the default group must be changed to a site-specific Active Directory group and membership must be severely restricted.'
      desc 'check', 'For systems that do not use Active Directory, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Config.HostAgent.plugins.hostsvc.esxAdminsGroup" value and verify it is not set to "ESX Admins".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-AdvancedSetting -Name Config.HostAgent.plugins.hostsvc.esxAdminsGroup

    If the "Config.HostAgent.plugins.hostsvc.esxAdminsGroup" setting is set to "ESX Admins", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Config.HostAgent.plugins.hostsvc.esxAdminsGroup" key and configure its value to an appropriate Active Directory group other than "ESX Admins".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-AdvancedSetting -Name Config.HostAgent.plugins.hostsvc.esxAdminsGroup | Set-AdvancedSetting -Value "<site specific AD group>"

    Note: Changing the group name does not remove the permissions of the previous group.'
      impact 0.5
      tag check_id: 'C-62536r933447_chk'
      tag severity: 'medium'
      tag gid: 'V-258796'
      tag rid: 'SV-258796r959010_rule'
      tag stig_id: 'ESXI-80-000241'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
      tag fix_id: 'F-62445r933448_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "Get-VMHost -Name #{vmhost} | Get-VMHostAuthentication | Select-Object -ExpandProperty DomainMembershipStatus"
          domainstatus = powercli_command(command).stdout
          if domainstatus.empty?
            impact 0.0
            describe '' do
              skip "The ESXi host #{vmhost} is not joined to AD, so this control is not applicable."
            end
          else
            command = "Get-VMHost -Name #{vmhost} | Get-AdvancedSetting -Name Config.HostAgent.plugins.hostsvc.esxAdminsGroup | Select-Object -ExpandProperty Value"
            describe powercli_command(command) do
              its('stdout.strip') { should_not cmp 'ESX Admins' }
              its('stdout.strip') { should cmp "#{input('adAdminGroup')}" }
            end
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000241.rb | gid: V-258796 | rid: SV-258796r959010_rule'
- id: ESXI-80-000243
  title: The ESXi host must configure a persistent log location for all locally stored logs.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000243' do
      title 'The ESXi host must configure a persistent log location for all locally stored logs.'
      desc %q(ESXi can be configured to store log files on an in-memory file system. This occurs when the host's "/scratch" directory is linked to "/tmp/scratch". When this is done, only a single day's worth of logs are stored at any time. In addition, log files will be reinitialized upon each reboot.

    This presents a security risk as user activity logged on the host is only stored temporarily and will not persist across reboots. This can also complicate auditing and make it harder to monitor events and diagnose issues. ESXi host logging should always be configured to a persistent datastore.

    Note: Scratch space is configured automatically during installation or first boot of an ESXi host and does not usually need to be configured manually.

    If ESXi is installed on an SD card or USB device, a persistent log location may not be configured upon install as normal.)
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Syslog.global.logDir" value and verify it is set to a persistent location.

    If the value of the setting is "[] /scratch/logs", verify the advanced setting "ScratchConfig.CurrentScratchLocation" is not set to "/tmp/scratch". This is a nonpersistent location.

    If "Syslog.global.logDir" is not configured to a persistent location, this is a finding.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following commands:

    $esxcli = Get-EsxCli -v2
    $esxcli.system.syslog.config.get.Invoke() | Select LocalLogOutput,LocalLogOutputIsPersistent

    If the "LocalLogOutputIsPersistent" value is not true, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Syslog.global.logDir" value and set it to a known persistent location.

    An example is shown below, where 51dda02d-fade5016-8a08-005056171889 is the UUID of the target datastore:

    /vmfs/volumes/51dda02d-fade5016-8a08-005056171889

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following command:

    Get-VMHost | Get-AdvancedSetting -Name Syslog.global.logDir | Set-AdvancedSetting -Value "New Log Location"

    Note: The new location should not include a subfolder as enabling audit logging will create a folder and will fail if a subfolder is specified.'
      impact 0.5
      tag check_id: 'C-62537r933450_chk'
      tag severity: 'medium'
      tag gid: 'V-258797'
      tag rid: 'SV-258797r1003575_rule'
      tag stig_id: 'ESXI-80-000243'
      tag gtitle: 'SRG-OS-000341-VMM-001220'
      tag fix_id: 'F-62446r1003544_fix'
      tag cci: ['CCI-001849']
      tag nist: ['AU-4']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
