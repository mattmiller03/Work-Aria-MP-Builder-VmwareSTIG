- id: ESXI-80-000198
  title: The ESXi host must protect the confidentiality and integrity of transmitted information by isolating
    ESXi management traffic.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000198' do
      title 'The ESXi host must protect the confidentiality and integrity of transmitted information by isolating ESXi management traffic.'
      desc 'The vSphere management network provides access to the vSphere management interface on each component. Services running on the management interface provide an opportunity for an attacker to gain privileged access to the systems. Any remote attack most likely would begin with gaining entry to this network.

    The Management VMkernel port group can be on a standard or distributed virtual switch but must be on a dedicated VLAN. The Management VLAN must not be shared by any other function and must not be accessible to anything other than management-related functions such as vCenter.'
      desc 'check', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Review each VMkernel adapter that is used for management traffic and view the "Enabled services".

    Review the VLAN associated with each VMkernel that is used for management traffic. Verify with the system administrator that they are dedicated for that purpose and are logically separated from other functions.

    If any services other than "Management" are enabled on the Management VMkernel adapter, this is a finding.

    If the network segment is accessible, except to networks where other management-related entities are located such as vCenter, this is a finding.

    If there are any other systems or devices such as VMs on the ESXi management segment, this is a finding.'
      desc 'fix', 'Configuration of the management VMkernel will be unique to each environment.

    For example, to modify the IP address and VLAN information to the correct network on a distributed switch, do the following:

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Select the Management VMkernel and click "Edit". On the Port properties tab, uncheck all services except for "Management". Click "OK".

    From the vSphere Client, go to Networking.

    Select a distributed switch >> Select a port group >> Configure >> Settings >> Properties.

    Click "Edit" and select VLAN.

    Change the "VLAN Type" to "VLAN" and change the "VLAN ID" to a network allocated and dedicated to management traffic exclusively. Click "OK".'
      impact 0.5
      tag check_id: 'C-62498r933333_chk'
      tag severity: 'medium'
      tag gid: 'V-258758'
      tag rid: 'SV-258758r958908_rule'
      tag stig_id: 'ESXI-80-000198'
      tag gtitle: 'SRG-OS-000423-VMM-001700'
      tag fix_id: 'F-62407r933334_fix'
      tag cci: ['CCI-002418']
      tag nist: ['SC-8']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          command = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -VMKernel | Where-Object {$_.ManagementTrafficEnabled -eq \"True\"} | Select-Object -ExpandProperty DeviceName"
          vmks = powercli_command(command).stdout

          vmks.split.each do |vmk|
            # Check to see if Management and any other services are enabled on the same VMkernel adapter
            command2 = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -Name #{vmk} | Where-Object {$_.VMotionEnabled -eq \"True\" -or $_.FaultToleranceLoggingEnabled -eq \"True\" -or $_.VsanTrafficEnabled -eq \"True\" -or $_.VSphereReplicationEnabled -eq \"True\" -or $_.VSphereReplicationNFCEnabled -eq \"True\" -or $_.VSphereBackupNFCEnabled -eq \"True\"} | Select-Object -ExpandProperty DeviceName"
            describe powercli_command(command2) do
              its('stdout.strip') { should be_empty }
            end
            # Commenting out for now. Checking the vlan isn't necessary to the finding statements.
            # # Get Management Port Group Name
            # command3 = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -Name #{vmk} | Select-Object -ExpandProperty PortGroupName"
            # pgname = powercli_command(command3).stdout.strip
            # # Test standard port groups
            # command4 = "Get-VMHost -Name #{vmhost} | Get-VirtualPortGroup -Name \"#{pgname}\" | Select-Object -ExpandProperty VlanId"
            # stdpgs = powercli_command(command4).stdout.strip
            # unless stdpgs.empty?
            #   describe 'Checking standand port group VLAN ID' do
            #     subject { stdpgs }
            #     it { should cmp "#{input('mgtVlanId')}" }
            #   end
            # end
            describe 'SA Interview' do
              skip 'SA also needs to confirm this VLAN is dedicated to Management and not shared with VMs or other services.'
            end
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000198.rb | gid: V-258758 | rid: SV-258758r958908_rule'
- id: ESXI-80-000199
  title: The ESXi host must protect the confidentiality and integrity of transmitted information by isolating
    IP-based storage traffic.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000199' do
      title 'The ESXi host must protect the confidentiality and integrity of transmitted information by isolating IP-based storage traffic.'
      desc 'Virtual machines (VMs) might share virtual switches and VLANs with the IP-based storage configurations. IP-based storage includes vSAN, iSCSI, and NFS. This configuration might expose IP-based storage traffic to unauthorized VM users. IP-based storage frequently is not encrypted. It can be viewed by anyone with access to this network.

    To restrict unauthorized users from viewing the IP-based storage traffic, the IP-based storage network must be logically separated from any other traffic. Configuring the IP-based storage adaptors on separate VLANs or network segments from other VMkernels and VMs will limit unauthorized users from viewing the traffic.'
      desc 'check', 'If IP-based storage is not used, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Review each VMkernel adapter that is used for IP-based storage traffic and view the "Enabled services".

    Review the VLAN associated with each VMkernel that is used for IP-based storage traffic. Verify with the system administrator that they are dedicated for that purpose and are logically separated from other functions.

    If any services are enabled on an NFS or iSCSI IP-based storage VMkernel adapter, this is a finding.

    If any services are enabled on a vSAN VMkernel adapter other than vSAN, this is a finding.

    If any IP-based storage networks are not isolated from other traffic types, this is a finding.'
      desc 'fix', %q(Configuration of an IP-Based VMkernel will be unique to each environment.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Select the VMkernel used for IP-based storage and click "Edit". On the "Port" properties tab, uncheck all services. Click "OK".

    Note: For VMkernels used for vSAN leave the vSAN service enabled and uncheck all others.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> Virtual switches.

    Find the port group that is dedicated to IP-based storage and click the '...' button next to the name. Click "Edit Settings".

    On the "Properties" tab, change the "VLAN ID" to one dedicated for IP-based storage traffic. Click "OK".)
      impact 0.5
      tag check_id: 'C-62499r933336_chk'
      tag severity: 'medium'
      tag gid: 'V-258759'
      tag rid: 'SV-258759r958908_rule'
      tag stig_id: 'ESXI-80-000199'
      tag gtitle: 'SRG-OS-000423-VMM-001700'
      tag fix_id: 'F-62408r933337_fix'
      tag cci: ['CCI-002418']
      tag nist: ['SC-8']

      vmhostName = input('vmhostName')
      cluster = input('cluster')
      allhosts = input('allesxi')
      vmhosts = []

      unless vmhostName.empty?
        vmhosts = powercli_command("Get-VMHost -Name #{vmhostName} | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless cluster.empty?
        vmhosts = powercli_command("Get-Cluster -Name '#{cluster}' | Get-VMHost | Sort-Object Name | Select -ExpandProperty Name").stdout.split
      end
      unless allhosts == false
        vmhosts = powercli_command('Get-VMHost | Sort-Object Name | Select -ExpandProperty Name').stdout.split
      end

      if !vmhosts.empty?
        vmhosts.each do |vmhost|
          # Check for iSCSI HBAs
          commandiscsihbas = "Get-VMHost -Name #{vmhost} | Get-VMHostHba | Where {$_.Type -eq 'iscsi'}"
          iscsi_hbas = powercli_command(commandiscsihbas).stdout

          # Check for vSAN VMkernels
          commandvsanvmks = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -VMKernel | Where-Object {$_.VsanTrafficEnabled -eq \"True\"} | Select-Object -ExpandProperty DeviceName"
          vsanvmks = powercli_command(commandvsanvmks).stdout

          # Check for NFS Datastores
          commandnfs = "Get-VMHost -Name #{vmhost} | Get-Datastore | Where {$_.Type -eq 'NFS'} | Select-Object -ExpandProperty Name"
          nfsds = powercli_command(commandnfs).stdout

          if iscsi_hbas.empty? && vsanvmks.empty? && nfsds.empty?
            describe '' do
              skip "The ESXi host #{vmhost} is not using IP-based storage, so this control is N/A."
            end
          else
            # Do any iSCSI VMKs have any services enabled?
            commandivmks = "$vmhost = Get-VMHost -Name #{vmhost}; $esxcli = Get-EsxCli -VMHost $vmhost -V2; $esxcli.iscsi.networkportal.list.Invoke() | Select-Object -ExpandProperty Vmknic"
            ivmks = powercli_command(commandivmks).stdout
            ivmks.split.each do |ivmk|
              commandvsck = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -Name #{ivmk} | Where-Object {$_.ManagementTrafficEnabled -eq \"True\" -or $_.VsanTrafficEnabled -eq \"True\" -or $_.FaultToleranceLoggingEnabled -eq \"True\" -or $_.VMotionEnabled -eq \"True\" -or $_.VSphereReplicationEnabled -eq \"True\" -or $_.VSphereReplicationNFCEnabled -eq \"True\" -or $_.VSphereBackupNFCEnabled -eq \"True\"} | Select-Object -ExpandProperty DeviceName"
              describe powercli_command(commandvsck) do
                its('stdout.strip') { should be_empty }
              end
            end
            # Does the vSAN VMK have any other services enabled?
            vsanvmks.split.each do |vmk|
              commandvsck = "Get-VMHost -Name #{vmhost} | Get-VMHostNetworkAdapter -Name #{vmk} | Where-Object {$_.ManagementTrafficEnabled -eq \"True\" -or $_.FaultToleranceLoggingEnabled -eq \"True\" -or $_.VMotionEnabled -eq \"True\" -or $_.VSphereReplicationEnabled -eq \"True\" -or $_.VSphereReplicationNFCEnabled -eq \"True\" -or $_.VSphereBackupNFCEnabled -eq \"True\"} | Select-Object -ExpandProperty DeviceName"
              describe powercli_command(commandvsck) do
                its('stdout.strip') { should be_empty }
              end
            end
            # Do any VMKs used for NFS storage have any services enabled?
            unless nfsds.empty?
              describe '' do
                skip "The ESXi host #{vmhost} has NFS datastores and requires manual validation."
              end
            end
          end
        end
      else
        describe 'No hosts found!' do
          skip 'No hosts found...skipping tests'
        end
      end
    end
  notes: 'source: ESXI-80-000199.rb | gid: V-258759 | rid: SV-258759r958908_rule'
- id: ESXI-80-000201
  title: The ESXi host lockdown mode exception users list must be verified.
  cat: 2
  check_method: TODO
  verified: false
  _inspec_source: |-
    control 'ESXI-80-000201' do
      title 'The ESXi host lockdown mode exception users list must be verified.'
      desc 'While a host is in lockdown mode (strict or normal), only users on the "Exception Users" list are allowed access. These users do not lose their permissions when the host enters lockdown mode.

    The organization may want to add service accounts such as a backup agent to the Exception Users list. Verify the list of users exempted from losing permissions is legitimate and as needed per the environment. Adding unnecessary users to the exception list defeats the purpose of lockdown mode.'
      desc 'check', 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Lockdown Mode", review the Exception Users list.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following script:

    $vmhost = Get-VMHost | Get-View
    $lockdown = Get-View $vmhost.ConfigManager.HostAccessManager
    $lockdown.QueryLockdownExceptions()

    If the Exception Users list contains accounts that do not require special permissions, this is a finding.

    Note: The Exception Users list is empty by default and should remain that way except under site-specific circumstances.'
      desc 'fix', 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Lockdown Mode", click "Edit" and remove unnecessary users from the Exception Users list.'
      impact 0.5
      tag check_id: 'C-62500r933339_chk'
      tag severity: 'medium'
      tag gid: 'V-258760'
      tag rid: 'SV-258760r959010_rule'
      tag stig_id: 'ESXI-80-000201'
      tag gtitle: 'SRG-OS-000480-VMM-002000'
