# VMware vSphere 8.0 vCenter STIG V2R3 — triaged for native-attach compliance.
# 9 rule(s) natively bindable (check_method: native_property, bound
# to native VMWARE config|* keys reused from VMware's shipping 7.0 STIG pack).
# The remainder are check_method: manual (out of native scope: esxcli/appliance
# shell/API/attested) — see each rule's `notes`. Regenerate native content with
# scripts/generate_native.py.
benchmark:
  id: vsphere-8.0-vcenter
  title: VMware vSphere 8.0 vCenter STIG
  version: V2R3
  status: stig
  applies_to:
  - '8.0'
  target_kind: STIG_VCENTER
rules:
- id: VCSA-80-000009
  title: The vCenter Server must use DOD-approved encryption to protect the confidentiality of network
    sessions.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (api_only): TLS global profile NIST_2024 read via appliance REST API (Invoke-GetTlsProfilesGlobal);
    no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000009' do
      title 'The vCenter Server must use DOD-approved encryption to protect the confidentiality of network sessions.'
      desc 'Using older unauthorized versions or incorrectly configuring protocol negotiation makes the gateway vulnerable to known and unknown attacks that exploit vulnerabilities in this protocol.

    In vCenter 8 Update 3, Transport Layer Security (TLS) Profiles were introduced that allow users to manage and configure TLS parameters for the vCenter server. Several TLS profiles are available by default but not all may be suitable for high security environments.'
      desc 'check', 'From the vSphere Client, go to Developer Center >> API Explorer.

    Select "appliance" from the "Select API" drop down list then scroll down to the "tls/profiles/global" section.

    Expand the GET call and click Execute and review the response for the configured global TLS profile.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Invoke-GetTlsProfilesGlobal

    If the global TLS profile is not "NIST_2024", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Developer Center >> API Explorer.

    Select "appliance" from the "Select API" drop down list then scroll down to the "tls/profiles/global" section.

    Expand the PUT call and enter the following in the value box:

    {
        "profile": "NIST_2024"
    }

    Click Execute and Continue to configure a new global TLS profile.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Invoke-SetProfilesGlobalAsync -TlsProfilesGlobalSetSpec (Initialize-TlsProfilesGlobalSetSpec -VarProfile NIST_2024)

    To monitor the status of the operation the task id from the command output can be used with the "Invoke-GetTask" command. For example:

    Invoke-GetTask -Task 66b247c2-fe02-4425-9338-1c88eb856138:com.vmware.appliance.tls.profiles.global'
      impact 0.5
      tag check_id: 'C-69901r1003611_chk'
      tag severity: 'medium'
      tag gid: 'V-265978'
      tag rid: 'SV-265978r1003613_rule'
      tag stig_id: 'VCSA-80-000009'
      tag gtitle: 'SRG-APP-000014'
      tag fix_id: 'F-69804r1003612_fix'
      tag cci: ['CCI-000068', 'CCI-000382', 'CCI-001184', 'CCI-001453', 'CCI-001941', 'CCI-002418', 'CCI-002420', 'CCI-002421', 'CCI-002422', 'CCI-002450']
      tag nist: ['AC-17 (2)', 'CM-7 b', 'SC-23', 'IA-2 (8)', 'SC-8', 'SC-8 (2)', 'SC-8 (1)', 'SC-13 b']

      command = 'Invoke-GetTlsProfilesGlobal | Select-Object -ExpandProperty profile'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp 'NIST_2024' }
      end
    end
- id: VCSA-80-000023
  title: The vCenter Server must enforce the limit of three consecutive invalid login attempts by a user.
  cat: 2
  verified: true
  check_method: native_property
  check:
    key: vc_appliance|sso_lockout_policy_failed_login_attempts
  resource_kind: VMwareAdapter Instance
  value_type: numeric
  finding_operator: '!='
  finding_value: '3.0'
  native_note: 7.0 pack key; (Get-SsoLockoutPolicy).MaxFailedAttempts should cmp '3'
  _inspec_source: |-
    control 'VCSA-80-000023' do
      title 'The vCenter Server must enforce the limit of three consecutive invalid login attempts by a user.'
      desc 'By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute forcing, is reduced. Limits are imposed by locking the account.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Lockout Policy.

    The following lockout policy should be set as follows:

    Maximum number of failed login attempts: 3

    If this account lockout policy is not configured as stated, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Lockout Policy.

    Click "Edit".

    Set the "Maximum number of failed login attempts" to "3" and click "Save".'
      impact 0.5
      tag check_id: 'C-62645r934371_chk'
      tag severity: 'medium'
      tag gid: 'V-258905'
      tag rid: 'SV-258905r960840_rule'
      tag stig_id: 'VCSA-80-000023'
      tag gtitle: 'SRG-APP-000065'
      tag fix_id: 'F-62554r934372_fix'
      tag cci: ['CCI-000044']
      tag nist: ['AC-7 a']

      command = '(Get-SsoLockoutPolicy).MaxFailedAttempts'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp '3' }
      end
    end
- id: VCSA-80-000024
  title: The vCenter Server must display the Standard Mandatory DOD Notice and Consent Banner before logon.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): DOD login banner is a manual/policy review (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000024' do
      title 'The vCenter Server must display the Standard Mandatory DOD Notice and Consent Banner before logon.'
      desc %q(Display of the DOD-approved use notification before granting access to the application ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.

    System use notifications are required only for access via login interfaces with human users and are not required when such human interfaces do not exist.

    The banner must be formatted in accordance with DTM-08-060. Use the following verbiage for applications that can accommodate banners of 1300 characters:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."

    Use the following verbiage for operating systems that have severe limitations on the number of characters that can be displayed in the banner:

    "I've read (literal ampersand) consent to terms in IS user agreem't."

    )
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Login Message.

    If the selection box next to "Show login message" is disabled, "Details of login message" is not configured to the standard DOD User Agreement, or the "Consent checkbox" is disabled, this is a finding.

    Note: Refer to vulnerability discussion for user agreement language.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Login Message.

    Click "Edit".

    Click the "Show login message" slider to enable.

    Configure the "Login message" to "DOD User Agreement".

    Click the "Consent checkbox" slider to enable.

    Set the "Details of login message" to the Standard Mandatory DOD Notice and Consent Banner text.

    Click "Save".'
      impact 0.5
      tag check_id: 'C-62646r934374_chk'
      tag severity: 'medium'
      tag gid: 'V-258906'
      tag rid: 'SV-258906r960843_rule'
      tag stig_id: 'VCSA-80-000024'
      tag gtitle: 'SRG-APP-000068'
      tag fix_id: 'F-62555r934375_fix'
      tag satisfies: ['SRG-APP-000068', 'SRG-APP-000069', 'SRG-APP-000070']
      tag cci: ['CCI-000048', 'CCI-000050', 'CCI-001384']
      tag nist: ['AC-8 a', 'AC-8 b', 'AC-8 c 1']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000034
  title: The vCenter Server must produce audit records containing information to establish what type of
    events occurred.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): config.log.level=info advanced setting; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000034' do
      title 'The vCenter Server must produce audit records containing information to establish what type of events occurred.'
      desc 'Without establishing what types of events occurred, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.'
      desc 'check', 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Verify the "config.log.level" value is set to "info".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-AdvancedSetting -Entity <vcenter server name> -Name config.log.level and verify it is set to "info".

    If the "config.log.level" value is not set to "info" or does not exist, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Click "Edit Settings" and configure the "config.log.level" setting to "info".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-AdvancedSetting -Entity <vcenter server name> -Name config.log.level | Set-AdvancedSetting -Value info'
      impact 0.5
      tag check_id: 'C-62647r934377_chk'
      tag severity: 'medium'
      tag gid: 'V-258907'
      tag rid: 'SV-258907r960891_rule'
      tag stig_id: 'VCSA-80-000034'
      tag gtitle: 'SRG-APP-000095'
      tag fix_id: 'F-62556r934378_fix'
      tag cci: ['CCI-000130']
      tag nist: ['AU-3 a']

      command = 'Get-AdvancedSetting -Entity $global:DefaultViServers.Name -Name config.log.level | Select-Object -ExpandProperty Value'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp 'info' }
      end
    end
- id: VCSA-80-000057
  title: vCenter Server plugins must be verified.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): Plugin verification is manual/policy review (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000057' do
      title 'vCenter Server plugins must be verified.'
      desc 'The vCenter Server includes a vSphere Client extensibility framework, which provides the ability to extend the vSphere Client with menu selections or toolbar icons that provide access to vCenter Server add-on components or external, web-based functionality.

    vSphere Client plugins or extensions run at the same privilege level as the user. Malicious extensions might masquerade as useful add-ons while compromising the system by stealing credentials or incorrectly configuring the system.

    Additionally, vCenter comes with a number of plugins preinstalled that may or may not be necessary for proper operation.'
      desc 'check', 'From the vSphere Client, go to Administration >> Solutions >> Client Plug-Ins.

    View the Installed/Available Plug-ins list and verify they are all identified as authorized VMware, third-party (partner), and/or site-specific approved plug-ins.

    If any installed/available plug-ins in the viewable list cannot be verified as allowed vSphere Client plug-ins from trusted sources or are not in active use, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Solutions >> Client Plug-Ins, click the radio button next to the unknown plug-in, and click "Disable".

    If the plugin will not be needed in the future, proceed to uninstall the plug-in.

    To uninstall plug-ins, do the following:

    If vCenter Server is in linked mode, perform this procedure on the vCenter Server that is used to install the plug-in initially and then restart the vCenter Server services on the linked vCenter Server:

    In a web browser, navigate to "http://vCenter_Server_name_or_IP/mob", where "vCenter_Server_name_or_IP/mob" is the name of the vCenter Server or its IP address.

    Click "Content".

    Click "ExtensionManager".

    Select and copy the name of the plug-in to be removed from the list of values under "Properties".

    Click "UnregisterExtension". A new window appears.

    Paste the name of the plug-in and click "Invoke Method". This removes the plug-in.

    Close the window.

    Refresh the Managed Object Type:ManagedObjectReference:ExtensionManager window to verify the plug-in is removed successfully.

    Note: If the plug-in still appears, restart the vSphere Client.

    Note: The Managed Object Browser (MOB) may have to be enabled temporarily if it was disabled previously.'
      impact 0.5
      tag check_id: 'C-62648r934380_chk'
      tag severity: 'medium'
      tag gid: 'V-258908'
      tag rid: 'SV-258908r960963_rule'
      tag stig_id: 'VCSA-80-000057'
      tag gtitle: 'SRG-APP-000141'
      tag fix_id: 'F-62557r934381_fix'
      tag cci: ['CCI-000381']
      tag nist: ['CM-7 a']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000059
  title: The vCenter Server must uniquely identify and authenticate users or processes acting on behalf
    of users.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): Identity provider / AD source verification is manual (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000059' do
      title 'The vCenter Server must uniquely identify and authenticate users or processes acting on behalf of users.'
      desc 'To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated to prevent potential misuse and compromise of the system.

    Organizational users include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes acting on behalf of users) must be uniquely identified and authenticated for all accesses except the following.

    (i) Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can be performed on the information system without identification or authentication; and
    (ii) Accesses that occur through authorized use of group authenticators without individual authentication. Organizations may require unique identification of individuals in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.

    Using Active Directory or an identity provider for authentication provides more robust account management capabilities and accountability.

    '
      desc 'check', 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider.

    If the identity provider type is "embedded" and there is no identity source of type "Active Directory" (either Windows Integrated Authentication or LDAP), this is a finding.

    If the identity provider type is "Microsoft ADFS" or another supported identity provider, this is NOT a finding.'
      desc 'fix', 'When using the embedded identity provider type, perform the following:

    From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider >> Identity Sources.

    Click "Add".

    Select either "Active Directory over LDAP" or "Active Directory (Windows Integrated Authentication)" and configure appropriately.

    Note: Windows Integrated Authentication requires that the vCenter server be joined to Active Directory before configuration via Administration >> Single Sign On >> Configuration >> Identity Provider >> Active Directory Domain.

    OR

    To change the identity provider type to a third-party identity provider such as Microsoft ADFS, perform the following:

    From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider.

    Click "Change Identity Provider".

    Select "Microsoft ADFS" and click "Next".

    Enter the ADFS server information and User and Group details and click "Finish".

    For additional information on configuring ADFS for use with vCenter, refer to the vSphere documentation.'
      impact 0.5
      tag check_id: 'C-62649r934383_chk'
      tag severity: 'medium'
      tag gid: 'V-258909'
      tag rid: 'SV-258909r1003590_rule'
      tag stig_id: 'VCSA-80-000059'
      tag gtitle: 'SRG-APP-000148'
      tag fix_id: 'F-62558r934384_fix'
      tag satisfies: ['SRG-APP-000148', 'SRG-APP-000153', 'SRG-APP-000163', 'SRG-APP-000180', 'SRG-APP-000234']
      tag cci: ['CCI-000764', 'CCI-004045', 'CCI-003627', 'CCI-000804', 'CCI-001682', 'CCI-000795', 'CCI-000770']
      tag nist: ['IA-2', 'IA-2 (5)', 'AC-2 (3) (a)', 'IA-8', 'AC-2 (2)', 'IA-4 e']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000060
  title: The vCenter Server must require multifactor authentication.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): MFA/SmartCardAuthnEnabled via SSO auth policy; no catalog
    key (else path manual)'
  _inspec_source: |-
    control 'VCSA-80-000060' do
      title 'The vCenter Server must require multifactor authentication.'
      desc 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.

    Multifactor authentication requires using two or more factors to achieve authentication.

    Factors include:
    (i) something a user knows (e.g., password/PIN);
    (ii) something a user has (e.g., cryptographic identification device, token); or
    (iii) something a user is (e.g., biometric).

    '
      desc 'check', 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider.

    If the embedded identity provider is used, click on "Smart Card Authentication".

    If the embedded identity provider is used and "Password authentication" is  enabled, this is a finding.

    If a third-party identity provider is used, such as Microsoft ADFS, and it does not require multifactor authentication to log on to vCenter, this is a finding.'
      desc 'fix', "To configure smart card authentication for vCenter when using the embedded identity provider, refer to the vSphere documentation.

    For vCenter Servers using a third-party identity provider, consult the product's documentation for enabling multifactor authentication."
      impact 0.5
      tag check_id: 'C-62650r934386_chk'
      tag severity: 'medium'
      tag gid: 'V-258910'
      tag rid: 'SV-258910r960864_rule'
      tag stig_id: 'VCSA-80-000060'
      tag gtitle: 'SRG-APP-000080'
      tag fix_id: 'F-62559r934387_fix'
      tag satisfies: ['SRG-APP-000080', 'SRG-APP-000149', 'SRG-APP-000150', 'SRG-APP-000391', 'SRG-APP-000402']
      tag cci: ['CCI-000166', 'CCI-000765', 'CCI-000766', 'CCI-001953', 'CCI-002009']
      tag nist: ['AU-10', 'IA-2 (1)', 'IA-2 (2)', 'IA-2 (12)', 'IA-8 (1)']

      if input('embeddedIdp')
        command = '(Get-SsoAuthenticationPolicy).SmartCardAuthnEnabled'
        describe powercli_command(command) do
          its('stdout.strip') { should cmp 'true' }
        end
      else
        describe 'This check is a manual or policy based check and must be reviewed manually.' do
          skip 'This check is a manual or policy based check and must be reviewed manually.'
        end
      end
    end
- id: VCSA-80-000069
  title: The vCenter Server passwords must be at least 15 characters in length.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO password MinLength; password policy not in catalog'
  _inspec_source: |-
    control 'VCSA-80-000069' do
      title 'The vCenter Server passwords must be at least 15 characters in length.'
      desc 'The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

    Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before the password is compromised.

    Use of more characters in a password helps to exponentially increase the time and/or resources required to compromise the password.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    View the value of the "Minimum Length" setting.

    Minimum Length: 15

    If the password policy is not configured with a "Minimum Length" policy of "15" or more, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    Click "Edit".

    Set the "Minimum Length" to "15" and click "Save".'
      impact 0.5
      tag check_id: 'C-62651r934389_chk'
      tag severity: 'medium'
      tag gid: 'V-258911'
      tag rid: 'SV-258911r1003591_rule'
      tag stig_id: 'VCSA-80-000069'
      tag gtitle: 'SRG-APP-000164'
      tag fix_id: 'F-62560r934390_fix'
      tag cci: ['CCI-004066', 'CCI-000205']
      tag nist: ['IA-5 (1) (h)', 'IA-5 (1) (a)']

      command = '(Get-SsoPasswordPolicy).MinLength'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp >= 15 }
      end
    end
- id: VCSA-80-000070
  title: The vCenter Server must prohibit password reuse for a minimum of five generations.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO ProhibitedPreviousPasswordsCount; password policy not
    in catalog'
  _inspec_source: |-
    control 'VCSA-80-000070' do
      title 'The vCenter Server must prohibit password reuse for a minimum of five generations.'
      desc 'Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

    To meet password policy requirements, passwords must be changed at specific policy-based intervals.

    If the information system or application allows the user to consecutively reuse their password when that password has exceeded its defined lifetime, the result is a password that is not changed per policy requirements.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    View the value of the "Restrict reuse" setting.

    Restrict reuse: Users cannot reuse any previous 5 passwords

    If the password policy is not configured with a "Restrict reuse" policy of "5" or more, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    Click "Edit".

    Set the "Restrict reuse" to "5" and click "Save".'
      impact 0.5
      tag check_id: 'C-62652r934392_chk'
      tag severity: 'medium'
      tag gid: 'V-258912'
      tag rid: 'SV-258912r1003592_rule'
      tag stig_id: 'VCSA-80-000070'
      tag gtitle: 'SRG-APP-000165'
      tag fix_id: 'F-62561r934393_fix'
      tag cci: ['CCI-004061']
      tag nist: ['IA-5 (1) (b)']

      command = '(Get-SsoPasswordPolicy).ProhibitedPreviousPasswordsCount'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp >= 5 }
      end
    end
- id: VCSA-80-000071
  title: The vCenter Server passwords must contain at least one uppercase character.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO MinUppercaseCount; password policy not in catalog'
  _inspec_source: |-
    control 'VCSA-80-000071' do
      title 'The vCenter Server passwords must contain at least one uppercase character.'
      desc 'Use of a complex password helps to increase the time and resources required to compromise the password. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force attacks.

    Password complexity is one factor of several that determine how long it takes to crack a password. The more complex the password is, the greater the number of possible combinations that need to be tested before the password is compromised.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    View the value of the "Character requirements" setting.

    Character requirements: At least 1 uppercase characters

    If the password policy is not configured with "Character requirements" policy requiring "1" or more uppercase characters, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    Click "Edit".

    Set "uppercase characters" to at least "1" and click "Save".'
      impact 0.5
      tag check_id: 'C-62653r934395_chk'
      tag severity: 'medium'
      tag gid: 'V-258913'
      tag rid: 'SV-258913r1003593_rule'
      tag stig_id: 'VCSA-80-000071'
      tag gtitle: 'SRG-APP-000166'
      tag fix_id: 'F-62562r934396_fix'
      tag cci: ['CCI-004066', 'CCI-000192']
      tag nist: ['IA-5 (1) (h)', 'IA-5 (1) (a)']

      command = '(Get-SsoPasswordPolicy).MinUppercaseCount'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp >= 1 }
      end
    end
- id: VCSA-80-000072
  title: The vCenter Server passwords must contain at least one lowercase character.
