- id: VCSA-80-000110
  title: The vCenter Server must manage excess capacity, bandwidth, or other redundancy to limit the effects
    of information flooding types of denial-of-service (DoS) attacks by enabling Network I/O Control (NIOC).
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): NIOC NetworkResourceManagementEnabled on VDSwitch; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000110' do
      title 'The vCenter Server must manage excess capacity, bandwidth, or other redundancy to limit the effects of information flooding types of denial-of-service (DoS) attacks by enabling Network I/O Control (NIOC).'
      desc 'DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

    Managing excess capacity ensures sufficient capacity is available to counter flooding attacks. Employing increased capacity and service redundancy may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected usage priorities, quotas, or partitioning.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to Networking.

    Select a distributed switch >> Configure >> Settings >> Properties.

    View the "Properties" pane and verify "Network I/O Control" is "Enabled".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDSwitch | select Name,@{N="NIOC Enabled";E={$_.ExtensionData.config.NetworkResourceManagementEnabled}}

    If "Network I/O Control" is disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Networking.

    Select a distributed switch >> Configure >> Settings >> Properties.

    In the "Properties" pane, click "Edit". Change "Network I/O Control" to "Enabled". Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    (Get-VDSwitch "VDSwitch Name" | Get-View).EnableNetworkResourceManagement($true)'
      impact 0.5
      tag check_id: 'C-62662r934422_chk'
      tag severity: 'medium'
      tag gid: 'V-258922'
      tag rid: 'SV-258922r961155_rule'
      tag stig_id: 'VCSA-80-000110'
      tag gtitle: 'SRG-APP-000247'
      tag fix_id: 'F-62571r934423_fix'
      tag cci: ['CCI-001095']
      tag nist: ['SC-5 (2)']

      command = 'Get-VDSwitch | Select -ExpandProperty Name'
      vdswitches = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdswitches.empty?
        impact 0.0
        describe 'No distributed switches found to check. This is not applicable.' do
          skip 'No distributed switches found to check. This is not applicable.'
        end
      else
        vdswitches.each do |vds|
          command = "(Get-VDSwitch -Name \"#{vds}\").ExtensionData.Config.NetworkResourceManagementEnabled"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'true' }
          end
        end
      end
    end
- id: VCSA-80-000123
  title: The vCenter Server must provide an immediate real-time alert to the system administrator (SA)
    and information system security officer (ISSO), at a minimum, on every Single Sign-On (SSO) account
    action.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO PrincipalManagement alarm definition; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000123' do
      title 'The vCenter Server must provide an immediate real-time alert to the system administrator (SA) and information system security officer (ISSO), at a minimum, on every Single Sign-On (SSO) account action.'
      desc 'Once an attacker establishes initial access to a system, they often attempt to create a persistent method of reestablishing access. One way to accomplish this is for the attacker to create a new account. They may also try to hijack an existing account by changing a password or enabling a previously disabled account. Therefore, all actions performed on accounts in the SSO domain much be alerted on in vCenter at a minimum and ideally on a Security Information and Event Management (SIEM) system as well.

    To ensure the appropriate personnel are alerted about SSO account actions, create a new vCenter alarm for the "com.vmware.sso.PrincipalManagement" event ID and configure the alert mechanisms appropriately.

    '
      desc 'check', 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Security >> Alarm Definitions.

    Verify there is an alarm created to alert upon all SSO account actions.

    The alarm name may vary, but it is suggested to name it "SSO account actions - com.vmware.sso.PrincipalManagement".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-AlarmDefinition | Where {$_.ExtensionData.Info.Expression.Expression.EventTypeId -eq "com.vmware.sso.PrincipalManagement"} | Select Name,Enabled,@{N="EventTypeId";E={$_.ExtensionData.Info.Expression.Expression.EventTypeId}}

    If an alarm is not created to alert on SSO account actions, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Security >> Alarm Definitions.

    Click "Add".

    Provide the alarm name of "SSO account actions - com.vmware.sso.PrincipalManagement" and an optional description.

    From the "Target type" dropdown menu, select "vCenter Server".

    Click "Next".

    Paste "com.vmware.sso.PrincipalManagement" (without quotes) in the line after "IF" and press "Enter".

    Next to "Trigger the alarm and", select "Show as Warning".

    Configure the desired notification actions that will inform the SA and ISSO of the event.

    Click "Next". Click "Next" again. Click "Create".'
      impact 0.5
      tag check_id: 'C-62663r934425_chk'
      tag severity: 'medium'
      tag gid: 'V-258923'
      tag rid: 'SV-258923r1003602_rule'
      tag stig_id: 'VCSA-80-000123'
      tag gtitle: 'SRG-APP-000291'
      tag fix_id: 'F-62572r934426_fix'
      tag satisfies: ['SRG-APP-000291', 'SRG-APP-000292', 'SRG-APP-000293', 'SRG-APP-000294', 'SRG-APP-000320']
      tag cci: ['CCI-000015', 'CCI-001685', 'CCI-002132', 'CCI-001683', 'CCI-001686', 'CCI-001684']
      tag nist: ['AC-2 (1)', 'AC-2 (4)']

      command = 'Get-AlarmDefinition | Where-Object {$_.ExtensionData.Info.Expression.Expression.EventTypeId -eq "com.vmware.sso.PrincipalManagement"} | Select-Object -ExpandProperty Enabled'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp 'true' }
      end
    end
