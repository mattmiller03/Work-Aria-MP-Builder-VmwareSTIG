- id: VCSA-80-000271
  title: The vCenter Server must only send NetFlow traffic to authorized collectors.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): NetFlow IpfixConfig collector address; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000271' do
      title 'The vCenter Server must only send NetFlow traffic to authorized collectors.'
      desc 'The distributed virtual switch can export NetFlow information about traffic crossing the switch. NetFlow exports are not encrypted and can contain information about the virtual network, making it easier for a man-in-the-middle attack to be executed successfully. If NetFlow export is required, verify that all NetFlow target Internet Protocols (IPs) are correct.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    To view NetFlow Collector IPs configured on distributed switches:

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> NetFlow.

    View the NetFlow pane and verify any collector IP addresses are valid and in use for troubleshooting.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDSwitch | select Name,@{N="NetFlowCollectorIPs";E={$_.ExtensionData.config.IpfixConfig.CollectorIpAddress}}

    To view if NetFlow is enabled on any distributed port groups:

    From the vSphere Client, go to "Networking".

    Select a distributed port group >> Manage >> Settings >> Policies.

    Go to "Monitoring" and view the NetFlow status.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDPortgroup | Select Name,VirtualSwitch,@{N="NetFlowEnabled";E={$_.Extensiondata.Config.defaultPortConfig.ipfixEnabled.Value}}

    If NetFlow is configured and the collector IP is not known and documented, this is a finding.'
      desc 'fix', 'To remove collector IPs, do the following:

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> NetFlow.

    Click "Edit".

    Remove any unknown collector IPs.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    $dvs = Get-VDSwitch dvswitch | Get-View
    ForEach($vs in $dvs){
    $spec = New-Object VMware.Vim.VMwareDVSConfigSpec
    $spec.configversion = $vs.Config.ConfigVersion
    $spec.IpfixConfig = New-Object VMware.Vim.VMwareIpfixConfig
    $spec.IpfixConfig.CollectorIpAddress = ""
    $spec.IpfixConfig.CollectorPort = "0"
    $spec.IpfixConfig.ActiveFlowTimeout = "60"
    $spec.IpfixConfig.IdleFlowTimeout = "15"
    $spec.IpfixConfig.SamplingRate = "0"
    $spec.IpfixConfig.InternalFlowsOnly = $False
    $vs.ReconfigureDvs_Task($spec)
    }

    Note: This will reset the NetFlow collector configuration back to the defaults.

    To disable NetFlow on a distributed port group, do the following:

    From the vSphere Client, go to "Networking".

    Select a distributed port group >> Configure >> Settings >> Policies.

    Click "Edit".

    Click the "Monitoring" tab.

    Change "NetFlow" to "Disabled".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    $pgs = Get-VDPortgroup | Get-View
    ForEach($pg in $pgs){
    $spec = New-Object VMware.Vim.DVPortgroupConfigSpec
    $spec.configversion = $pg.Config.ConfigVersion
    $spec.defaultPortConfig = New-Object VMware.Vim.VMwareDVSPortSetting
    $spec.defaultPortConfig.ipfixEnabled = New-Object VMware.Vim.BoolPolicy
    $spec.defaultPortConfig.ipfixEnabled.inherited = $false
    $spec.defaultPortConfig.ipfixEnabled.value = $false
    $pg.ReconfigureDVPortgroup_Task($spec)
    }'
      impact 0.5
      tag check_id: 'C-62678r934470_chk'
      tag severity: 'medium'
      tag gid: 'V-258938'
      tag rid: 'SV-258938r961863_rule'
      tag stig_id: 'VCSA-80-000271'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62587r934471_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDSwitch | Select -ExpandProperty Name'
      vdswitches = powercli_command(command).stdout.strip.gsub("\r\n", "\n").split("\n")
      if vdswitches.empty?
        impact 0.0
        describe 'No distributed switches found. This is not applicable.' do
          skip 'No distributed switches found. This is not applicable.'
        end
      else
        setimpact = true
        vdswitches.each do |vds|
          command = "(Get-VDSwitch -Name \"#{vds}\").ExtensionData.Config.IpfixConfig.CollectorIpAddress"
          result = powercli_command(command).stdout.strip
          if !result.empty?
            describe '' do
              subject { result }
              it { should cmp "#{input('ipfixCollectorAddress')}" }
            end
            setimpact = false
          else
            describe '' do
              skip "Ipfix CollectorIpAddress not configured...skipping #{vds}."
            end
          end
        end
      end
      unless !setimpact
        impact 0.0
      end
    end
- id: VCSA-80-000272
  title: The vCenter Server must configure all port groups to a value other than that of the native virtual
    local area network (VLAN).
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): Port group native VLAN (VlanId != 1); no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000272' do
      title 'The vCenter Server must configure all port groups to a value other than that of the native virtual local area network (VLAN).'
      desc 'ESXi does not use the concept of native VLAN. Frames with VLAN specified in the port group will have a tag, but frames with VLAN not specified in the port group are not tagged and therefore will end up belonging to native VLAN of the physical switch.

    For example, frames on VLAN 1 from a Cisco physical switch will be untagged, because this is considered as the native VLAN. However, frames from ESXi specified as VLAN 1 will be tagged with a "1"; therefore, traffic from ESXi that is destined for the native VLAN will not be correctly routed (because it is tagged with a "1" instead of being untagged), and traffic from the physical switch coming from the native VLAN will not be visible (because it is not tagged).

    If the ESXi virtual switch port group uses the native VLAN ID, traffic from those virtual machines will not be visible to the native VLAN on the switch, because the switch is expecting untagged traffic.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings >> Policies.

    Review the port group VLAN tags and verify they are not set to the native VLAN ID of the attached physical switch.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDPortgroup | select Name, VlanConfiguration

    If any port group is configured with the native VLAN of the ESXi hosts attached physical switch, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings >> Policies.

    Click "Edit".

    Click the "VLAN" tab.

    Change the VLAN ID to a nonnative VLAN.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDPortgroup "portgroup name" | Set-VDVlanConfiguration -VlanId "New VLAN#"'
      impact 0.5
      tag check_id: 'C-62679r934473_chk'
      tag severity: 'medium'
      tag gid: 'V-258939'
      tag rid: 'SV-258939r961863_rule'
      tag stig_id: 'VCSA-80-000272'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62588r934474_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDPortgroup | Where-Object {$_.IsUplink -eq $false} | Select -ExpandProperty Name'
      vdportgroups = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdportgroups.empty?
        impact 0.0
        describe 'No distributed port groups found. This is not applicable.' do
          skip 'No distributed port groups found. This is not applicable.'
        end
      else
        vdportgroups.each do |vdpg|
          command = "(Get-VDPortgroup -Name \"#{vdpg}\").ExtensionData.Config.DefaultPortConfig.Vlan.VlanId"
          describe powercli_command(command) do
            its('stdout.strip') { should_not cmp '1' }
          end
        end
      end
    end
- id: VCSA-80-000273
  title: The vCenter Server must not configure VLAN Trunking unless Virtual Guest Tagging (VGT) is required
    and authorized.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): VLAN trunking range check; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000273' do
      title 'The vCenter Server must not configure VLAN Trunking unless Virtual Guest Tagging (VGT) is required and authorized.'
      desc 'When a port group is set to VLAN Trunking, the vSwitch passes all network frames in the specified range to the attached virtual machines without modifying the virtual local area network (VLAN) tags. In vSphere, this is referred to as VGT.

    The virtual machine must process the VLAN information itself via an 802.1Q driver in the operating system. VLAN Trunking must only be implemented if the attached virtual machines have been specifically authorized and are capable of managing VLAN tags themselves.

    If VLAN Trunking is enabled inappropriately, it may cause a denial of service or allow a virtual machine to interact with traffic on an unauthorized VLAN.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings >> Policies.

    Review the port group "VLAN Type" and "VLAN trunk range", if present.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDPortgroup | Where {$_.ExtensionData.Config.Uplink -ne "True"} | Select Name,VlanConfiguration

    If any port group is configured with "VLAN trunking" and is not documented as a needed exception (such as NSX appliances), this is a finding.

    If any port group is authorized to be configured with "VLAN trunking" but is not configured with the most limited range necessary, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings >> Policies.

    Click "Edit".

    Click the "VLAN" tab.

    If "VLAN trunking" is not authorized, remove it by setting "VLAN type" to "VLAN" and configure an appropriate VLAN ID. Click "OK".

    If "VLAN trunking" is authorized but the range is too broad, modify the range in the "VLAN trunk range" field to the minimum necessary and authorized range. An example range would be "1,3-5,8". Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command to configure trunking:

    Get-VDPortgroup "Portgroup Name" | Set-VDVlanConfiguration -VlanTrunkRange "<VLAN Range(s) comma separated>"

    or

    Run this command to configure a single VLAN ID:

    Get-VDPortgroup "Portgroup Name" | Set-VDVlanConfiguration -VlanId "<New VLAN#>"'
      impact 0.5
      tag check_id: 'C-62680r934476_chk'
      tag severity: 'medium'
      tag gid: 'V-258940'
      tag rid: 'SV-258940r961863_rule'
      tag stig_id: 'VCSA-80-000273'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62589r934477_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDPortgroup | Where-Object {(($_.IsUplink -eq $false) -and ($_.VlanConfiguration -match "Trunk"))} | Select-Object -ExpandProperty Name'
      vdportgroups = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdportgroups.empty?
        impact 0.0
        describe 'No distributed port groups found to check. This is not applicable.' do
          skip 'No distributed port groups found to check. This is not applicable.'
        end
      else
        vdportgroups.each do |vdpg|
          command = "(Get-VDPortgroup -Name \"#{vdpg}\").ExtensionData.Config.DefaultPortConfig.Vlan.VlanId.Start"
          describe powercli_command(command) do
            its('stdout.strip') { should_not cmp '0' }
          end
          command = "(Get-VDPortgroup -Name \"#{vdpg}\").ExtensionData.Config.DefaultPortConfig.Vlan.VlanId.End"
          describe powercli_command(command) do
            its('stdout.strip') { should_not cmp '4094' }
          end
        end
      end
    end
