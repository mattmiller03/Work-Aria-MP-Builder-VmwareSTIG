- id: VCSA-80-000158
  title: The vCenter Server must compare internal information system clocks at least every 24 hours with
    an authoritative time server.
  cat: 2
  verified: true
  check_method: native_property
  check:
    key: vc_appliance|timeSyncMode
  resource_kind: VMwareAdapter Instance
  value_type: string
  finding_operator: '!='
  finding_value: NTP
  native_note: 7.0 pack key; Invoke-GetTimesync; timesync should cmp 'NTP'
  _inspec_source: |-
    control 'VCSA-80-000158' do
      title 'The vCenter Server must compare internal information system clocks at least every 24 hours with an authoritative time server.'
      desc 'Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating system events. Sources outside of the configured acceptable allowance (drift) may be inaccurate. Additionally, unnecessary synchronization may have an adverse impact on system performance and may indicate malicious activity.

    Synchronizing internal information system clocks to an authoritative time server provides uniformity of time stamps for information systems with multiple system clocks and systems connected over a network.'
      desc 'check', 'Open the Virtual Appliance Management Interface (VAMI) by navigating to https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a single sign-on (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator" group.

    Select "Time" on the left navigation pane.

    On the resulting pane on the right, verify at least one authorized time server is configured and is listed as "Reachable".

    If "NTP" is not enabled and at least one authorized time server configured, this is a finding.'
      desc 'fix', 'Open the VAMI by navigating to https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with an SSO account that is a member of the "SystemConfiguration.BashShellAdministrator" group.

    Select "Time" on the left navigation pane.

    On the resulting pane on the right, click "Edit" under "Time Synchronization".

    Select "NTP" for "Mode" and enter a list of authorized time servers separated by commas. Click "Save".'
      impact 0.5
      tag check_id: 'C-62667r1003603_chk'
      tag severity: 'medium'
      tag gid: 'V-258927'
      tag rid: 'SV-258927r1003604_rule'
      tag stig_id: 'VCSA-80-000158'
      tag gtitle: 'SRG-APP-000371'
      tag fix_id: 'F-62576r934438_fix'
      tag cci: ['CCI-004923', 'CCI-001891']
      tag nist: ['SC-45 (1) (a)', 'AU-8 (1) (a)']

      command = 'Invoke-GetTimesync'
      timesync = powercli_command(command).stdout.strip

      if timesync == 'NTP'
        ntpserverscommand = 'Invoke-GetNtp'
        ntpservers = powercli_command(ntpserverscommand).stdout.gsub("\r\n", "\n").split("\n")
        ntpservers.each do |server|
          describe server do
            subject { server }
            it { should be_in input('ntpServers') }
          end
          ntpstatuscommand = "Initialize-NtpTestRequestBody -Servers #{server} | Invoke-TestNtp -Confirm:$false | Select-Object -ExpandProperty status"
          ntpstatus = powercli_command(ntpstatuscommand).stdout.strip
          describe ntpstatus do
            subject { ntpstatus }
            it { should cmp 'SERVER_REACHABLE' }
          end
        end
      else
        describe "Timesync Configuration: #{timesync}" do
          subject { timesync }
          it { should cmp 'NTP' }
        end
      end
    end
- id: VCSA-80-000195
  title: The vCenter Server Machine Secure Sockets Layer (SSL) certificate must be issued by a DOD certificate
    authority.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): Machine SSL cert issuer_organization; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000195' do
      title 'The vCenter Server Machine Secure Sockets Layer (SSL) certificate must be issued by a DOD certificate authority.'
      desc 'Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations or individuals that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA used for verifying the certificate is not a DOD-approved CA, trust of this CA has not been established.

    The DOD will only accept public key infrastructure (PKI) certificates obtained from a DOD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure sessions includes, for example, the use of Transport Layer Security (TLS) certificates.

    The default self-signed, VMware Certificate Authority (VMCA)-issued vCenter reverse proxy certificate must be replaced with a DOD-approved certificate. The use of a DOD certificate on the vCenter reverse proxy and other services assures clients that the service they are connecting to is legitimate and trusted.'
      desc 'check', 'From the vSphere Client, go to Administration >> Certificates >> Certificate Management >> Machine SSL Certificate.

    Click "View Details" and examine the "Issuer Information" block.

    If the issuer specified is not a DOD approved certificate authority, this is a finding.'
      desc 'fix', 'Obtain a DOD-issued certificate and private key for each vCenter in the system following the requirements below:

    Key size: 2048 bits or more (PEM encoded)
    CRT format (Base-64)
    x509 version 3
    SubjectAltName must contain DNS Name=<machine_FQDN>
    Contains the following Key Usages: Digital Signature, Non Repudiation, Key Encipherment

    Export the entire certificate issuing chain up to the root in Base-64 format. Concatenate the individual certificates into one file with the ".cer" extension.

    From the vSphere Client, go to Administration >> Certificates >> Certificate Management >> Machine SSL Certificate.

    Click Actions >> Import and Replace Certificate.

    Select the "Replace with external CA certificate" radio button and click "Next".

    Supply the CA-issued certificate , the exported roots file, and the private key.

    Click "Replace".'
      impact 0.5
      tag check_id: 'C-62668r934440_chk'
      tag severity: 'medium'
      tag gid: 'V-258928'
      tag rid: 'SV-258928r961596_rule'
      tag stig_id: 'VCSA-80-000195'
      tag gtitle: 'SRG-APP-000427'
      tag fix_id: 'F-62577r934441_fix'
      tag cci: ['CCI-002470']
      tag nist: ['SC-23 (5)']

      vcenter = powercli_command('$global:DefaultViServers.Name').stdout.strip
      describe ssl_certificate(host: "#{vcenter}", port: 443) do
        its('issuer_organization') { should cmp 'U.S. Government' }
      end
    end
- id: VCSA-80-000196
  title: The vCenter Server must enable data at rest encryption for vSAN.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): vSAN data-at-rest EncryptionEnabled via VsanClusterConfiguration;
    no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000196' do
      title 'The vCenter Server must enable data at rest encryption for vSAN.'
      desc 'Applications handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest.

    Data encryption is a common technique used in environments that require additional levels of security. It consists of a process to ensure that data can only be consumed by systems that have appropriate levels of access. Approved systems must have and use the appropriate cryptographic keys to encrypt and decrypt the data. Systems that do not have the keys will not be able to consume the data in any meaningful way, as it will remain encrypted in accordance with the commonly used Advanced Encryption Standard (AES) from the National Institute of Standards and Technology, or NIST.

    vSAN supports Data-At-Rest Encryption and Data-in-Transit Encryption and uses an AES 256 cipher. Data is encrypted after all other processing, such as deduplication, is performed. Data at rest encryption protects data on storage devices in case a device is removed from the cluster.'
      desc 'check', 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >> Data Services.

    Review the "Data-at-rest encryption" status.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-Cluster | Where-Object {$_.VsanEnabled -eq $true} | Get-VsanClusterConfiguration | Select-Object Name,EncryptionEnabled

    If "Data-At-Rest encryption" is not enabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the target cluster >> Configure >> vSAN >> Services >> Data Services.

    Click "Edit".

    Enable "Data-At-Rest encryption" and select a pre-configured key provider from the drop down. Click "Apply".

    Note: Before enabling, read and understand the operational implications of enabling data at rest encryption in vSAN and how it effects capacity, performance, and recovery scenarios.'
      impact 0.5
      tag check_id: 'C-62669r934443_chk'
      tag severity: 'medium'
      tag gid: 'V-258929'
      tag rid: 'SV-258929r961599_rule'
      tag stig_id: 'VCSA-80-000196'
      tag gtitle: 'SRG-APP-000428'
      tag fix_id: 'F-62578r934444_fix'
      tag cci: ['CCI-002475']
      tag nist: ['SC-28 (1)']

      # Get all clusters with vSAN enabled
      clusters = powercli_command('Get-Cluster | Where-Object {$_.VsanEnabled -eq $true} | Sort-Object | Select-Object -ExpandProperty Name').stdout.gsub("\r\n", "\n").split("\n")

      if !clusters.empty?
        clusters.each do |cluster|
          command = "Get-Cluster -Name #{cluster} | Get-VsanClusterConfiguration | Select-Object -ExpandProperty EncryptionEnabled"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'true' }
          end
        end
      else
        impact 0.0
        describe 'No clusters with vSAN enabled found. This is not applicable.' do
          skip 'No clusters with vSAN enabled found. This is not applicable.'
        end
      end
    end
