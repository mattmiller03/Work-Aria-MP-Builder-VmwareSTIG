- id: VCSA-80-000077
  title: The vCenter Server must enable FIPS-validated cryptography.
  cat: 1
  verified: false
  check_method: manual
  notes: 'out of native scope (api_only): Global FIPS via appliance REST API (Invoke-GetSystemGlobalFips);
    no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000077' do
      title 'The vCenter Server must enable FIPS-validated cryptography.'
      desc 'FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules use authentication that meets DOD requirements.

    In vSphere 6.7 and later, ESXi and vCenter Server use FIPS-validated cryptography to protect management interfaces and the VMware Certificate Authority (VMCA).

    vSphere 7.0 Update 2 and later adds additional FIPS-validated cryptography to vCenter Server Appliance. By default, this FIPS validation option is disabled and must be enabled.

    '
      desc 'check', 'From the vSphere Web Client, go to Developer Center >> API Explorer.

    From the "Select API" drop-down menu, select appliance.

    Expand system/security/global_fips >> GET.

    Click "Execute" and then "Copy Response" to view the results.

    Example response:

    {
        "enabled": true
    }

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Invoke-GetSystemGlobalFips

    If global FIPS mode is not enabled, this is a finding.'
      desc 'fix', 'From the vSphere Web Client go to Developer Center >> API Explorer.

    From the "Select API" drop-down menu, select appliance.

    Expand system/security/global_fips >> PUT.

    In the response body under "Try it out" paste the following:

    {
        "enabled": true
    }

    Click "Execute".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    $spec = Initialize-SystemSecurityGlobalFipsUpdateSpec -Enabled $true; Invoke-SetSystemGlobalFips -SystemSecurityGlobalFipsUpdateSpec $spec

    Note: The vCenter server reboots after FIPS is enabled or disabled.'
      impact 0.7
      tag check_id: 'C-62657r934407_chk'
      tag severity: 'high'
      tag gid: 'V-258917'
      tag rid: 'SV-258917r961029_rule'
      tag stig_id: 'VCSA-80-000077'
      tag gtitle: 'SRG-APP-000172'
      tag fix_id: 'F-62566r934408_fix'
      tag satisfies: ['SRG-APP-000172', 'SRG-APP-000179', 'SRG-APP-000224', 'SRG-APP-000231', 'SRG-APP-000412', 'SRG-APP-000514', 'SRG-APP-000555', 'SRG-APP-000600', 'SRG-APP-000610', 'SRG-APP-000620', 'SRG-APP-000630', 'SRG-APP-000635']
      tag cci: ['CCI-000197', 'CCI-000803', 'CCI-001188', 'CCI-001199', 'CCI-001967', 'CCI-002450', 'CCI-003123']
      tag nist: ['IA-5 (1) (c)', 'IA-7', 'SC-23 (3)', 'SC-28', 'IA-3 (1)', 'SC-13 b', 'MA-4 (6)']

      command = 'Invoke-GetSystemGlobalFips | Select-Object -ExpandProperty enabled'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp 'True' }
      end
    end
- id: VCSA-80-000079
  title: The vCenter Server must enforce a 90-day maximum password lifetime restriction.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO PasswordLifetimeDays; password policy not in catalog'
  _inspec_source: |-
    control 'VCSA-80-000079' do
      title 'The vCenter Server must enforce a 90-day maximum password lifetime restriction.'
      desc 'Any password, no matter how complex, can eventually be cracked. Therefore, passwords must be changed at specific intervals.

    One method of minimizing this risk is to use complex passwords and periodically change them. If the application does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the system and/or application passwords could be compromised.

    This requirement does not include emergency administration accounts, which are meant for access to the application in case of failure. These accounts are not required to have maximum password lifetime restrictions.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    View the value of the "Maximum lifetime" setting.

    Maximum lifetime: Password must be changed every 90 days

    If the password policy is not configured with "Maximum lifetime" policy of "90" or less, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Local Accounts >> Password Policy.

    Click "Edit".

    Set "Maximum lifetime" to "90" and click "Save".'
      impact 0.5
      tag check_id: 'C-62658r934410_chk'
      tag severity: 'medium'
      tag gid: 'V-258918'
      tag rid: 'SV-258918r1003597_rule'
      tag stig_id: 'VCSA-80-000079'
      tag gtitle: 'SRG-APP-000174'
      tag fix_id: 'F-62567r934411_fix'
      tag cci: ['CCI-004066', 'CCI-000199']
      tag nist: ['IA-5 (1) (h)', 'IA-5 (1) (d)']

      command = '(Get-SsoPasswordPolicy).PasswordLifetimeDays'
      describe powercli_command(command) do
        its('stdout.strip') { should cmp <= 90 }
      end
    end
- id: VCSA-80-000080
  title: The vCenter Server must enable revocation checking for certificate-based authentication.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): Cert revocation OCSP/CRL via SSO auth policy; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000080' do
      title 'The vCenter Server must enable revocation checking for certificate-based authentication.'
      desc 'The system must establish the validity of the user-supplied identity certificate using Online Certificate Status Protocol (OCSP) and/or Certificate Revocation List (CRL) revocation checking.

    '
      desc 'check', 'If a federated identity provider is configured and used for an identity source and supports smart card authentication, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider >> Smart Card Authentication.

    Under Smart Card Authentication settings >> Certificate Revocation, verify "Revocation check" does not show as disabled.

    If "Revocation check" shows as disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider >> Smart Card Authentication.

    Under Smart Card Authentication settings >> Certificate Revocation, click the "Edit" button.

    Configure revocation checking per site requirements. OCSP with CRL failover is recommended.

    Note: If FIPS mode is enabled on vCenter, OCSP revocation validation may not function and CRL bay be used instead.

    By default, both locations are pulled from the cert. CRL location can be overridden in this screen, and local responders can be specified via the sso-config command line tool. Refer to the vSphere documentation for more information.'
      impact 0.5
      tag check_id: 'C-62659r1003598_chk'
      tag severity: 'medium'
      tag gid: 'V-258919'
      tag rid: 'SV-258919r1003600_rule'
      tag stig_id: 'VCSA-80-000080'
      tag gtitle: 'SRG-APP-000175'
      tag fix_id: 'F-62568r1003599_fix'
      tag satisfies: ['SRG-APP-000175', 'SRG-APP-000392', 'SRG-APP-000401', 'SRG-APP-000403']
      tag cci: ['CCI-000185', 'CCI-001954', 'CCI-004068', 'CCI-002010', 'CCI-001991']
      tag nist: ['IA-5 (2) (b) (1)', 'IA-2 (12)', 'IA-5 (2) (b) (2)', 'IA-8 (1)', 'IA-5 (2) (d)']

      if input('embeddedIdp')
        describe.one do
          describe powercli_command('(Get-SsoAuthenticationPolicy).OCSPEnabled') do
            its('stdout.strip') { should cmp 'true' }
          end
          describe powercli_command('(Get-SsoAuthenticationPolicy).UseInCertCRL') do
            its('stdout.strip') { should cmp 'true' }
          end
          describe powercli_command('(Get-SsoAuthenticationPolicy).CRLUrl') do
            its('stdout.strip') { should_not cmp '' }
          end
        end
      else
        describe 'This check is a manual or policy based check and must be reviewed manually.' do
          skip 'This check is a manual or policy based check and must be reviewed manually.'
        end
      end
    end
