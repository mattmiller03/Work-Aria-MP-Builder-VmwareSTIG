- id: VCSA-80-000267
  title: The vCenter Server must disable the distributed virtual switch health check.
  cat: 2
  verified: true
  check_method: native_property
  check:
    key: config|health_check_config|health_check_config_vlan_mtu
  resource_kind: VmwareDistributedVirtualSwitch
  value_type: string
  finding_operator: '='
  finding_value: 'true'
  native_note: 7.0 pack key; (Get-VDSwitch).ExtensionData.Config.HealthCheckConfig | Select -ExpandProperty
    Enable should cmp 'false'
  _inspec_source: |-
    control 'VCSA-80-000267' do
      title 'The vCenter Server must disable the distributed virtual switch health check.'
      desc 'Network health check is disabled by default. Once enabled, the health check packets contain information on host#, vds#, and port#, which an attacker would find useful. It is recommended that network health check be used for troubleshooting and turned off when troubleshooting is finished.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> Health Check.

    View the health check pane and verify the "VLAN and MTU" and "Teaming and failover" checks are "Disabled".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    $vds = Get-VDSwitch
    $vds.ExtensionData.Config.HealthCheckConfig

    If the health check feature is enabled on distributed switches and is not on temporarily for troubleshooting purposes, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> Health Check.

    Click "Edit".

    Disable the "VLAN and MTU" and "Teaming and failover" checks.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-View -ViewType DistributedVirtualSwitch | ?{($_.config.HealthCheckConfig | ?{$_.enable -notmatch "False"})}| %{$_.UpdateDVSHealthCheckConfig(@((New-Object Vmware.Vim.VMwareDVSVlanMtuHealthCheckConfig -property @{enable=0}),(New-Object Vmware.Vim.VMwareDVSTeamingHealthCheckConfig -property @{enable=0})))}'
      impact 0.5
      tag check_id: 'C-62674r934458_chk'
      tag severity: 'medium'
      tag gid: 'V-258934'
      tag rid: 'SV-258934r961863_rule'
      tag stig_id: 'VCSA-80-000267'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62583r934459_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDSwitch | Select -ExpandProperty Name'
      vdswitches = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdswitches.empty?
        impact 0.0
        describe 'No distributed switches found. This is not applicable.' do
          skip 'No distributed switches found. This is not applicable.'
        end
      else
        vdswitches.each do |vds|
          command = "(Get-VDSwitch -Name \"#{vds}\").ExtensionData.Config.HealthCheckConfig | Select-Object -ExpandProperty Enable"
          checks = powercli_command(command)
          checks.stdout.split.each do |hc|
            describe "Health check for #{vds}" do
              subject { hc }
              it { should cmp 'false' }
            end
          end
        end
      end
    end
- id: VCSA-80-000268
  title: The vCenter Server must set the distributed port group Forged Transmits policy to "Reject".
  cat: 2
  verified: true
  check_method: native_property
  check:
    key: config|policies|security|forged_transmits
  resource_kind: DistributedVirtualPortgroup
  value_type: string
  finding_operator: '='
  finding_value: 'true'
  native_note: 7.0 pack key; Get-VDSecurityPolicy | Select -ExpandProperty ForgedTransmits should cmp
    'false'
  _inspec_source: |-
    control 'VCSA-80-000268' do
      title 'The vCenter Server must set the distributed port group Forged Transmits policy to "Reject".'
      desc 'If the virtual machine operating system changes the Media Access Control (MAC) address, the operating system can send frames with an impersonated source MAC address at any time. This allows an operating system to stage malicious attacks on the devices in a network by impersonating a network adaptor authorized by the receiving network.

    When the "Forged Transmits" option is set to "Accept", ESXi does not compare source and effective MAC addresses.

    To protect against MAC impersonation, set the "Forged Transmits" option to "Reject". The host compares the source MAC address being transmitted by the guest operating system with the effective MAC address for its virtual machine adapter to determine if they match. If the addresses do not match, the ESXi host drops the packet.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a port group >> Configure >> Settings >> Policies.

    Verify "Forged Transmits" is set to "Reject".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    Get-VDSwitch | Get-VDSecurityPolicy
    Get-VDPortgroup | ?{$_.IsUplink -eq $false} | Get-VDSecurityPolicy

    If the "Forged Transmits" policy is set to accept for a nonuplink port, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a port group >> Configure >> Settings >> Policies.

    Click "Edit".

    Click the "Security" tab.

    Set "Forged Transmits" to "Reject".

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    Get-VDSwitch | Get-VDSecurityPolicy | Set-VDSecurityPolicy -ForgedTransmits $false
    Get-VDPortgroup | ?{$_.IsUplink -eq $false} | Get-VDSecurityPolicy | Set-VDSecurityPolicy -ForgedTransmits $false'
      impact 0.5
      tag check_id: 'C-62675r934461_chk'
      tag severity: 'medium'
      tag gid: 'V-258935'
      tag rid: 'SV-258935r961863_rule'
      tag stig_id: 'VCSA-80-000268'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62584r934462_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDSwitch | Select -ExpandProperty Name'
      vdswitches = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdswitches.empty?
        impact 0.0
        describe 'No distributed switches found. This is not applicable.' do
          skip 'No distributed switches found. This is not applicable.'
        end
      else
        vdswitches.each do |vds|
          command = "(Get-VDSwitch -Name \"#{vds}\") | Get-VDSecurityPolicy | Select-Object -ExpandProperty ForgedTransmits"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'false' }
          end
        end
        command = 'Get-VDPortgroup | Where-Object {$_.IsUplink -eq $false} | Select -ExpandProperty Name'
        vdportgroups = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")
        if vdportgroups.empty?
          describe 'No distributed port groups found.' do
            skip 'No distributed port groups found.'
          end
        else
          vdportgroups.each do |vdpg|
            command = "(Get-VDPortgroup -Name \"#{vdpg}\") | Get-VDSecurityPolicy | Select-Object -ExpandProperty ForgedTransmits"
            describe powercli_command(command) do
              its('stdout.strip') { should cmp 'false' }
            end
          end
        end
      end
    end
