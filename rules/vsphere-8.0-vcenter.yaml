- id: VCSA-80-000284
  title: The vCenter Server must restrict access to the default roles with cryptographic permissions.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): Crypto role membership via Get-VIPermission; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000284' do
      title 'The vCenter Server must restrict access to the default roles with cryptographic permissions.'
      desc 'In vSphere, the built-in "Administrator" role contains permission to perform cryptographic operations such as Key Management Server (KMS) functions and encrypting and decrypting virtual machine disks. This role must be reserved for cryptographic administrators where virtual machine encryption and/or vSAN encryption is in use.

    A new built-in role called "No Cryptography Administrator" exists to provide all administrative permissions except cryptographic operations. Permissions must be restricted such that normal vSphere administrators are assigned the "No Cryptography Administrator" role or more restrictive.

    The "Administrator" role must be tightly controlled and must not be applied to administrators who will not be doing cryptographic work. Catastrophic data loss can result from poorly administered cryptography.'
      desc 'check', 'By default, there are five roles that contain cryptographic related permissions: Administrator, No Trusted Infrastructure Administrator, vCLSAdmin, VMOperator Controller Manager, and vSphere Kubernetes Manager.

    From the vSphere Client, go to Administration >> Access Control >> Roles.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VIPermission | Where {$_.Role -eq "Admin" -or $_.Role -eq "NoTrustedAdmin" -or $_.Role -eq "vCLSAdmin" -or $_.Role -eq "VMOperatorController" -or $_.Role -eq "vSphereKubernetesManager"} | Select Role,Principal,Entity,Propagate,IsGroup | FT -Auto

    If there are any users or groups assigned to the default roles with cryptographic permissions and are not explicitly designated to perform cryptographic operations, this is a finding.

    The built-in solution users assigned to the administrator role are NOT a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Access Control >> Roles.

    Move any accounts not explicitly designated for cryptographic operations, other than Solution Users, to other roles such as "No Cryptography Administrator".'
      impact 0.5
      tag check_id: 'C-62691r1003605_chk'
      tag severity: 'medium'
      tag gid: 'V-258951'
      tag rid: 'SV-258951r1003606_rule'
      tag stig_id: 'VCSA-80-000284'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62600r934510_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vcCryptoAdmins = input('vcCryptoAdmins')

      # Get all users/groups with Admin/Administrator role excluding vpxd- accounts
      command = 'Get-VIPermission | Where-Object {($_.Role -eq "Admin" -or $_.Role -eq "NoTrustedAdmin" -or $_.Role -eq "vCLSAdmin" -or $_.Role -eq "vSphereKubernetesManager") -and $_.Principal -notmatch "vpxd-"} | Select-Object -ExpandProperty Principal'
      cryptoadmins = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if !cryptoadmins.empty?
        cryptoadmins.each do |cryptoadmin|
          describe cryptoadmin do
            subject { cryptoadmin }
            it { should be_in vcCryptoAdmins }
          end
        end
      else
        describe 'No users/groups found assigned to crypto roles...skipping tests.' do
          skip 'No users/groups found assigned to crypto roles...skipping tests.'
        end
      end
    end
- id: VCSA-80-000285
  title: The vCenter Server must restrict access to cryptographic permissions.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): Crypto privilege roles via Get-VIRole; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000285' do
      title 'The vCenter Server must restrict access to cryptographic permissions.'
      desc 'These permissions must be reserved for cryptographic administrators where virtual machine encryption and/or vSAN encryption is in use. Catastrophic data loss can result from poorly administered cryptography.'
      desc 'check', 'By default, there are five roles that contain cryptographic related permissions: Administrator, No Trusted Infrastructure Administrator, vCLSAdmin, VMOperator Controller Manager, and vSphere Kubernetes Manager.

    From the vSphere Client, go to Administration >> Access Control >> Roles.

    Highlight each role and click the "Privileges" button in the right pane.

    Verify that only the Administrator, No Trusted Infrastructure Administrator, vCLSAdmin, and vSphere Kubernetes Manager and any site-specific cryptographic roles have the following permissions:

    Cryptographic Operations privileges
    Global.Diagnostics
    Host.Inventory.Add host to cluster
    Host.Inventory.Add standalone host
    Host.Local operations.Manage user groups

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    $roles = Get-VIRole
    ForEach($role in $roles){
        $privileges = $role.PrivilegeList
        If($privileges -match "Crypto*" -or $privileges -match "Global.Diagnostics" -or $privileges -match "Host.Inventory.Add*" -or $privileges -match "Host.Local operations.Manage user groups"){
        Write-Host "$role has Cryptographic privileges"
        }
    }

    If any role other than the five default roles contain the permissions listed above and is not authorized to perform cryptographic related operations, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Access Control >> Roles.

    Highlight the target custom role and click "Edit".

    Remove the following permissions from any custom role that is not authorized to perform cryptographic related operations:

    Cryptographic Operations privileges
    Global.Diagnostics
    Host.Inventory.Add host to cluster
    Host.Inventory.Add standalone host
    Host.Local operations.Manage user groups'
      impact 0.5
      tag check_id: 'C-62692r1003607_chk'
      tag severity: 'medium'
      tag gid: 'V-258952'
      tag rid: 'SV-258952r1003608_rule'
      tag stig_id: 'VCSA-80-000285'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62601r934513_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      vcCryptoRoles = input('vcCryptoRoles')

      command = 'Get-VIRole | Where-Object {$_.PrivilegeList -match "Crypto*" -or $_.PrivilegeList -match "Global.Diagnostics" -or $_.PrivilegeList -match "Host.Inventory.Add*" -or $_.PrivilegeList -match "Host.Local operations.Manage user groups"} | Select-Object -ExpandProperty Name'
      cryptoroles = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if !cryptoroles.empty?
        cryptoroles.each do |cryptorole|
          describe cryptorole do
            subject { cryptorole }
            it { should be_in vcCryptoRoles }
          end
        end
      else
        describe 'No roles found with crypto permissions...skipping tests.' do
          skip 'No roles found with crypto permissions...skipping tests.'
        end
      end
    end
- id: VCSA-80-000286
  title: The vCenter Server must have Mutual Challenge Handshake Authentication Protocol (CHAP) configured
    for vSAN Internet Small Computer System Interface (iSCSI) targets.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): vSAN iSCSI Mutual CHAP config; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000286' do
      title 'The vCenter Server must have Mutual Challenge Handshake Authentication Protocol (CHAP) configured for vSAN Internet Small Computer System Interface (iSCSI) targets.'
      desc 'When enabled, vSphere performs bidirectional authentication of both the iSCSI target and host. When not authenticating both the iSCSI target and host, the potential exists for a man-in-the-middle attack in which an attacker might impersonate either side of the connection to steal data. Bidirectional authentication mitigates this risk.'
      desc 'check', 'If no clusters are enabled for vSAN or if vSAN is enabled but iSCSI is not enabled, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Configure >> vSAN >> iSCSI Target Service.

    For each iSCSI target, review the value in the "Authentication" column.

    If the Authentication method is not set to "CHAP_Mutual" for any iSCSI target, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Configure >> vSAN >> iSCSI Target Service.

    For each iSCSI target, select the item and click "Edit".

    Change the "Authentication" field to "Mutual CHAP" and configure the incoming and outgoing users and secrets appropriately.'
      impact 0.5
      tag check_id: 'C-62693r934515_chk'
      tag severity: 'medium'
      tag gid: 'V-258953'
      tag rid: 'SV-258953r961863_rule'
      tag stig_id: 'VCSA-80-000286'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62602r934516_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      clusters = powercli_command('Get-Cluster | Where-Object {$_.VsanEnabled -eq $true} | Sort-Object Name | Select -ExpandProperty Name').stdout.gsub("\r\n", "\n").split("\n")

      setimpact = true
      if !clusters.empty?
        clusters.each do |cluster|
          iscsiEnabled = powercli_command("(Get-VsanClusterConfiguration -Cluster \"#{cluster}\").IscsiTargetServiceEnabled").stdout.strip
          if iscsiEnabled == 'True'
            command = "(Get-VsanClusterConfiguration -Cluster \"#{cluster}\").DefaultIscsiAuthenticationType"
            describe powercli_command(command) do
              its('stdout.strip') { should cmp 'MutualChap' }
            end
            setimpact = false
          else
            describe "vSAN iSCSI service not enabled on cluster: #{cluster}. This is not applicable." do
              skip "vSAN iSCSI service not enabled on cluster: #{cluster}. This is not applicable."
            end
          end
        end
      else
        describe 'No clusters with vSAN enabled found. This is not applicable.' do
          skip 'No clusters with vSAN enabled found. This is not applicable.'
        end
      end
      unless !setimpact
        impact 0.0
      end
    end
- id: VCSA-80-000287
  title: The vCenter Server must have new Key Encryption Keys (KEKs) reissued at regular intervals for
    vSAN encrypted datastore(s).
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): vSAN KEK reissue interval is manual review (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000287' do
      title 'The vCenter Server must have new Key Encryption Keys (KEKs) reissued at regular intervals for vSAN encrypted datastore(s).'
      desc 'The KEK for a vSAN encrypted datastore is generated by the Key Management Server (KMS) and serves as a wrapper and lock around the Disk Encryption Key (DEK). The DEK is generated by the host and is used to encrypt and decrypt the datastore. A shallow rekey is a procedure in which the KMS issues a new KEK to the ESXi host, which rewraps the DEK but does not change the DEK or any data on disk.

    This operation must be done on a regular, site-defined interval and can be viewed as similar in criticality to changing an administrative password. If the KMS is compromised, a standing operational procedure to rekey will put a time limit on the usefulness of any stolen KMS data.'
      desc 'check', 'If vSAN is not in use, this is not applicable.

    Interview the system administrator (SA) to determine that a procedure has been put in place to perform a shallow rekey of all vSAN encrypted datastores at regular, site-defined intervals.

    VMware recommends a 60-day rekey task, but this interval must be defined by the SA and the ISSO.

    If vSAN encryption is not in use, this is not a finding.

    If vSAN encryption is in use and a regular rekey procedure is not in place, this is a finding.'
      desc 'fix', 'If vSAN encryption is in use, ensure a regular rekey procedure is in place.

    To generate new encryption keys for vSAN, do the following:

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >> Data Services.

    Select "Generate New Encryption Keys" and optionally generate new DEKs and click "Generate".'
      impact 0.5
      tag check_id: 'C-62694r934518_chk'
      tag severity: 'medium'
      tag gid: 'V-258954'
      tag rid: 'SV-258954r1003610_rule'
      tag stig_id: 'VCSA-80-000287'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62603r1003609_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000288
  title: The vCenter Server must use secure Lightweight Directory Access Protocol (LDAPS) when adding
    an LDAP identity source.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): LDAPS identity source is manual review (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000288' do
      title 'The vCenter Server must use secure Lightweight Directory Access Protocol (LDAPS) when adding an LDAP identity source.'
      desc 'LDAP is an industry standard protocol for querying directory services such as Active Directory. This protocol can operate in clear text or over a Secure Sockets Layer (SSL)/Transport Layer Security (TLS) encrypted tunnel. To protect confidentiality of LDAP communications, secure LDAP (LDAPS) must be explicitly configured when adding an LDAP identity source in vSphere Single Sign-On (SSO).

    When configuring an identity source and supplying an SSL certificate, vCenter will enforce LDAPS. The server URLs do not need to be explicitly provided if an SSL certificate is uploaded.'
      desc 'check', 'If LDAP is not used as an identity provider, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider.

    Click the "Identity Sources" tab.

    For each identity source of type "Active Directory over LDAP", if the "Server URL" does not indicate "ldaps://", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider.

    Click the "Identity Sources" tab.

    For each identity source of type "Active Directory over LDAP" where LDAPS is not configured, highlight the item and click "Edit".

    Ensure the primary and secondary server URLs, if specified, are configured for "ldaps://".

    At the bottom, click the "Browse" button, select the AD LDAP cert previously exported to your local computer, click "Open", and "Save" to complete modifications.

    Note: With LDAPS, the server must be a specific domain controller and its specific certificate or the domain alias with a certificate that is valid for that URL.'
      impact 0.5
      tag check_id: 'C-62695r934521_chk'
      tag severity: 'medium'
      tag gid: 'V-258955'
      tag rid: 'SV-258955r961863_rule'
      tag stig_id: 'VCSA-80-000288'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62604r934522_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000290
  title: The vCenter Server must limit membership to the "SystemConfiguration.BashShellAdministrators"
    Single Sign-On (SSO) group.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): BashShellAdministrators SSO group membership; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000290' do
      title 'The vCenter Server must limit membership to the "SystemConfiguration.BashShellAdministrators" Single Sign-On (SSO) group.'
      desc 'vCenter SSO integrates with PAM in the underlying Photon operating system so members of the "SystemConfiguration.BashShellAdministrators" SSO group can log on to the operating system without needing a separate account. However, even though unique SSO users log on, they are transparently using a group account named "sso-user" as far as Photon auditing is concerned. While the audit trail can still be traced back to the individual SSO user, it is a more involved process.

    To force accountability and nonrepudiation, the SSO group "SystemConfiguration.BashShellAdministrators" must be severely restricted.'
      desc 'check', 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups >> Groups.

    Click the next page arrow until the "SystemConfiguration.BashShellAdministrators" group appears.

    Click "SystemConfiguration.BashShellAdministrators".

    Review the members of the group and ensure that only authorized accounts are present.

    Note: By default the Administrator and a unique service account similar to "vmware-applmgmtservice-714684a4-342f-4eff-a232-cdc21def00c2" will be in the group and should not be removed.

    If there are any accounts present as members of SystemConfiguration.BashShellAdministrators that are not authorized, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups >> Groups.

    Click the next page arrow until the "SystemConfiguration.BashShellAdministrators" group appears.

    Click "SystemConfiguration.BashShellAdministrators".

    Click the three vertical dots next to the name of each unauthorized account.

    Select "Remove Member".'
      impact 0.5
      tag check_id: 'C-62696r934524_chk'
      tag severity: 'medium'
      tag gid: 'V-258956'
      tag rid: 'SV-258956r961863_rule'
      tag stig_id: 'VCSA-80-000290'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62605r934525_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      bashShellAdminUsers = input('bashShellAdminUsers')
      # Get appliance management user and add to list of authorized users. Unique to each vCenter.
      applmgmtuser = powercli_command('Get-SsoGroup -Domain vsphere.local -Name applmgmtSvcUsers | Get-SsoPersonUser | Select-Object -ExpandProperty Name').stdout.strip
      bashShellAdminUsers.push(applmgmtuser)
      users = powercli_command('Get-SsoGroup -Domain vsphere.local -Name SystemConfiguration.BashShellAdministrators | Get-SsoPersonUser | Select-Object -ExpandProperty Name')
      if users.stdout.empty?
        describe 'Stderr should be empty or only contain the known "no users found" SSO exception' do
          subject { users.stderr }
          it { should match(/\A\s*\z|Idm client exception: null/) }
        end
        describe 'No users found in SystemConfiguration.BashShellAdministrators' do
          subject { users.stdout }
          it { should be_empty }
        end
      else
        users.stdout.gsub("\r\n", "\n").split("\n").each do |user|
          describe user do
            it { should be_in bashShellAdminUsers }
          end
        end
      end
      bashShellAdminGroups = input('bashShellAdminGroups')
      groups = powercli_command('Get-SsoGroup -Domain vsphere.local -Name SystemConfiguration.BashShellAdministrators | Get-SsoGroup | Select-Object -ExpandProperty Name')
      if groups.stdout.empty?
        describe 'Stderr should be empty or only contain the known "no groups found" SSO exception' do
          subject { groups.stderr }
          it { should match(/\A\s*\z|Idm client exception: null/) }
        end
        describe 'No groups found in SystemConfiguration.BashShellAdministrators' do
          subject { groups.stdout }
          it { should be_empty }
        end
      else
        groups.stdout.gsub("\r\n", "\n").split("\n").each do |group|
          describe group do
            it { should be_in bashShellAdminGroups }
          end
        end
      end
    end
- id: VCSA-80-000291
  title: The vCenter Server must limit membership to the "TrustedAdmins" Single Sign-On (SSO) group.
  cat: 2
