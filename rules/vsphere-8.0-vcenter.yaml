    control 'VCSA-80-000296' do
      title 'The vCenter server must enable the OVF security policy for content libraries.'
      desc 'In the vSphere Client, you can create a local or a subscribed content library. By using content libraries, you can store and manage content in one vCenter Server instance. Alternatively, you can distribute content across vCenter Server instances to increase consistency and facilitate the deployment workloads at scale.

    You can protect the OVF items by applying default OVF security policy to a content library. The OVF security policy enforces strict validation on OVF items when you deploy or update the item, import items, or synchronize OVF and OVA templates. To make sure that the OVF and OVA templates are signed by a trusted certificate, you can add the OVF signing certificate from a trusted CA.'
      desc 'check', 'Note: If Content Libraries are not used, this is not applicable.

    From the vSphere Client, go to Content Libraries.

    Review the "Security Policy" column.

    If a content library does not have the "OVF default policy" enabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Content Libraries.

    Select the target content library.

    Select "Actions" then "Edit Settings".

    Click the checkbox to "Apply Security Policy". Click "OK".

    Note: If you disable the security policy of a content library, you cannot reuse the existing OVF items.'
      impact 0.5
      tag check_id: 'C-62702r934542_chk'
      tag severity: 'medium'
      tag gid: 'V-258962'
      tag rid: 'SV-258962r961863_rule'
      tag stig_id: 'VCSA-80-000296'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62611r934543_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-ContentLibrary | Select-Object -ExpandProperty Id'
      libraries = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if !libraries.blank?
        libraries.each do |library|
          libinfo = powercli_command("Invoke-GetLibraryIdContent #{library} | ConvertTo-Json").stdout
          libinfojson = JSON.parse(libinfo)
          describe "OVF security policy should be enabled on Content Library: #{libinfojson['name']}" do
            subject { libinfojson }
            its(['security_policy_id']) { should_not be_blank }
          end
        end
      else
        impact 0.0
        describe 'No content libraries found. This is not applicable.' do
          skip 'No content libraries found. This is not applicable.'
        end
      end
    end
- id: VCSA-80-000298
  title: The vCenter Server must separate authentication and authorization for administrators.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (manual): Separation of auth/authz is manual review (InSpec skip)'
  _inspec_source: |-
    control 'VCSA-80-000298' do
      title 'The vCenter Server must separate authentication and authorization for administrators.'
      desc 'Many organizations do both authentication and authorization using a centralized directory service such as Active Directory. Attackers who compromise an identity source can often add themselves to authorization groups, and simply log into systems they should not otherwise have access to. Additionally, reliance on central identity systems means that the administrators of those systems are potentially infrastructure administrators, too, as they can add themselves to infrastructure access groups at will.

    The use of local SSO groups for authorization helps prevent this avenue of attack by allowing the centralized identity source to still authenticate users but moving authorization into vCenter itself.'
      desc 'check', 'From the vSphere Client, go to Administration >> Access Control >> Roles.

    View the Administrator role and any other role providing administrative access to vCenter to verify the users and/or groups assigned to it by clicking on "Usage".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VIPermission | Sort Role | Select Role,Principal,Entity,Propagate,IsGroup | FT -Auto

    If any user or group is directly assigned a role with administrative access to vCenter that is from an identity provider, this is a finding.

    Note: Users and/or groups assigned to roles should be from the "VSPHERE.LOCAL" identity source.'
      desc 'fix', 'To add groups from an identity provider to the local SSO Administrators group, as an example, do the following:

    From the vSphere Client, go to Administration >> Single Sign On >> Groups.

    Select the Administrators group and click "Edit".

    In the "Add Members" section, select the identity source and type the name of the target user/group in the search bar.

    Select the target user/group to add them and click "Save".

    Note: A new SSO group or groups can be created as needed and used to provide authorization to vCenter.

    To remove identity provider users/groups from a role, do the following:

    From the vSphere Client, go to Administration >> Access Control >> Global Permissions.

    Select the offending user/group and click "Delete".

    Note: If permissions are assigned on a specific object, then the role must be updated where it is assigned (for example, at the cluster level).'
      impact 0.5
      tag check_id: 'C-62703r934545_chk'
      tag severity: 'medium'
      tag gid: 'V-258963'
      tag rid: 'SV-258963r961863_rule'
      tag stig_id: 'VCSA-80-000298'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62612r934546_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      describe 'This check is a manual or policy based check and must be reviewed manually.' do
        skip 'This check is a manual or policy based check and must be reviewed manually.'
      end
    end
- id: VCSA-80-000299
  title: The vCenter Server must disable CDP/LLDP on distributed switches.
  cat: 3
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): DVS LinkDiscoveryProtocolOperation (CDP/LLDP); no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000299' do
      title 'The vCenter Server must disable CDP/LLDP on distributed switches.'
      desc 'The vSphere Distributed Virtual Switch can participate in Cisco Discovery Protocol (CDP) or Link Layer Discovery Protocol (LLDP), as a listener, advertiser, or both. The information is sensitive, including IP addresses, system names, software versions, and more. It can be used by an adversary to gain a better understanding of your environment, and to impersonate devices. It is also transmitted unencrypted on the network, and as such the recommendation is to disable it.'
      desc 'check', 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> Properties.

    Review the "Discovery Protocol" configuration.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDSwitch | Select Name,LinkDiscoveryProtocolOperation

    If any distributed switch does not have "Discovery Protocols" disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> Properties.

    Click "Edit".

    Select the advanced tab and update the "Type" under "Discovery Protocol" to disabled and click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following command:

    Get-VDSwitch -Name "DSwitch" | Set-VDSwitch -LinkDiscoveryProtocolOperation "Disabled"'
      impact 0.3
      tag check_id: 'C-62704r934548_chk'
      tag severity: 'low'
      tag gid: 'V-258964'
      tag rid: 'SV-258964r961863_rule'
      tag stig_id: 'VCSA-80-000299'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62613r934549_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-VDSwitch | Select -ExpandProperty Name'
      vdswitches = powercli_command(command).stdout.gsub("\r\n", "\n").split("\n")

      if vdswitches.empty?
        impact 0.0
        describe 'No distributed switches found. This is not applicable.' do
          skip 'No distributed switches found. This is not applicable.'
        end
      else
        vdswitches.each do |vds|
          command = "Get-VDSwitch -Name \"#{vds}\" | Select -ExpandProperty LinkDiscoveryProtocolOperation"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'Disabled' }
          end
        end
      end
    end
