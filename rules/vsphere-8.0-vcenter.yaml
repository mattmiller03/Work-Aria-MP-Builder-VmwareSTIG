          end
        end
      end
    end
- id: VCSA-80-000303
  title: The vCenter Server must disable Secure Shell (SSH) access.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (api_only): SSH access via appliance REST API (Invoke-GetAccessSsh); no
    catalog key'
  _inspec_source: |-
    control 'VCSA-80-000303' do
      title 'The vCenter Server must disable Secure Shell (SSH) access.'
      desc 'vCenter Server is delivered as an appliance, and intended to be managed through the VAMI, vSphere Client, and APIs. SSH is a troubleshooting and support tool and should only be enabled when necessary.

    vCenter Server High Availability uses SSH to coordinate the replication and failover between the nodes. Use of this feature requires SSH to remain enabled.'
      desc 'check', 'Open the Virtual Appliance Management Interface (VAMI) by navigating to https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a Single Sign-On (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator" group.

    Select "Access" on the left navigation pane.

    If "SSH Login" is not "Deactivated", this is a finding.'
      desc 'fix', 'Open the Virtual Appliance Management Interface (VAMI) by navigating to https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a Single Sign-On (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator" group.

    Select "Access" on the left navigation pane.

    Click "Edit" then disable "Activate SSH Login" and click "OK".'
      impact 0.5
      tag check_id: 'C-62708r934560_chk'
      tag severity: 'medium'
      tag gid: 'V-258968'
      tag rid: 'SV-258968r961863_rule'
      tag stig_id: 'VCSA-80-000303'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62617r934561_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      describe powercli_command('Invoke-GetAccessSsh').stdout.strip do
        it { should_not cmp 'true' }
      end
    end
- id: VCSA-80-000304
  title: The vCenter Server must enable data in transit encryption for vSAN.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): vSAN data-in-transit encryption via VsanView; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000304' do
      title 'The vCenter Server must enable data in transit encryption for vSAN.'
      desc 'Transit encryption must be enabled to prevent unauthorized disclosure information and to protect the confidentiality of organizational information.

    vSAN data-in-transit encryption has the following characteristics:
    -vSAN uses AES-256 bit encryption on data in transit.
    -Forward secrecy is enforced for vSAN data-in-transit encryption.
    -Traffic between data hosts and witness hosts is encrypted.
    -File service data traffic between the VDFS proxy and VDFS server is encrypted.
    -vSAN file services inter-host connections are encrypted.
    -vSAN uses symmetric keys that are generated dynamically and shared between hosts. Hosts dynamically generate an encryption key when they establish a connection, and they use the key to encrypt all traffic between the hosts. You do not need a key management server to perform data-in-transit encryption.

    Each host is authenticated when it joins the cluster, ensuring connections only to trusted hosts are allowed. When a host is removed from the cluster, it is authentication certificate is removed.

    vSAN data-in-transit encryption is a cluster-wide setting. When enabled, all data and metadata traffic is encrypted as it transits across hosts.'
      desc 'check', 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >> Data Services.

    Review the "Data-in-transit encryption" status.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    $vsanclusterconf = Get-VsanView -Id VsanVcClusterConfigSystem-vsan-cluster-config-system
    $vsanclusterconf.VsanClusterGetConfig((Get-Cluster -Name <cluster name>).ExtensionData.MoRef).DataInTransitEncryptionConfig

    Repeat these steps for each vSAN enabled cluster in the environment.

    If "Data-In-Transit encryption" is not enabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the target cluster >> Configure >> vSAN >> Services >> Data Services.

    Click "Edit".

    Enable "Data-In-Transit encryption" and choose a rekey interval suitable for the environment then click "Apply".'
      impact 0.5
      tag check_id: 'C-62709r934563_chk'
      tag severity: 'medium'
      tag gid: 'V-258969'
      tag rid: 'SV-258969r961863_rule'
      tag stig_id: 'VCSA-80-000304'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62618r934564_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      # Get all clusters with vSAN enabled
      clusters = powercli_command('Get-Cluster | Where-Object {$_.VsanEnabled -eq $true} | Sort-Object | Select-Object -ExpandProperty Name').stdout.gsub("\r\n", "\n").split("\n")

      if !clusters.empty?
        clusters.each do |cluster|
          command = "$vsanclusterconf = Get-VsanView -Id VsanVcClusterConfigSystem-vsan-cluster-config-system; $vsanclusterconf.VsanClusterGetConfig((Get-Cluster -Name #{cluster}).ExtensionData.MoRef).DataInTransitEncryptionConfig.Enabled"
          describe powercli_command(command) do
            its('stdout.strip') { should cmp 'true' }
          end
        end
      else
        impact 0.0
        describe 'No clusters with vSAN enabled found. This is not applicable.' do
          skip 'No clusters with vSAN enabled found. This is not applicable.'
        end
      end
    end
- id: VCSA-80-000305
  title: The vCenter Server must disable accounts used for Integrated Windows Authentication (IWA).
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): IWA account (K/M, krbtgt) Disabled via Get-SsoPersonUser;
    no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000305' do
      title 'The vCenter Server must disable accounts used for Integrated Windows Authentication (IWA).'
      desc 'If not used for their intended purpose, default accounts must be disabled. vCenter ships with several default accounts, two of which are specific to IWA and SASL/Kerberos authentication. If other methods of authentication are used, these accounts are not needed and must be disabled.'
      desc 'check', 'If IWA is used for vCenter authentication, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups >> Users.

    Change the domain to "vsphere.local" and review the "K/M" and "krbtgt/VSPHERE.LOCAL" accounts.

    If the "K/M" and "krbtgt/VSPHERE.LOCAL" accounts are not disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups >> Users.

    Select the "K/M" or "krbtgt/VSPHERE.LOCAL" and click "More" then select "Disable".

    Click "Ok" to disable the user account.'
      impact 0.5
      tag check_id: 'C-69902r1003614_chk'
      tag severity: 'medium'
      tag gid: 'V-265979'
      tag rid: 'SV-265979r1003616_rule'
      tag stig_id: 'VCSA-80-000305'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-69805r1003615_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      if input('iwaEnabled')
        impact 0.0
        describe 'Integrated Windows Authentication specified as in use. This control is not applicable' do
          skip 'Integrated Windows Authentication specified as in use. This control is not applicable'
        end
      else
        describe powercli_command('Get-SsoPersonUser -Domain vsphere.local -Name "K/M" | Select-Object -ExpandProperty Disabled') do
          its('stdout.strip') { should cmp 'true' }
        end
        describe powercli_command('Get-SsoPersonUser -Domain vsphere.local -Name "krbtgt/VSPHERE.LOCAL" | Select-Object -ExpandProperty Disabled') do
          its('stdout.strip') { should cmp 'true' }
        end
      end
    end
