    end
- id: VCSA-80-000281
  title: The vCenter Server must disable or restrict the connectivity between vSAN Health Check and public
    Hardware Compatibility List (HCL) by use of an external proxy server.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): vSAN HCL internet/proxy config via VsanView; no catalog
    key'
  _inspec_source: |-
    control 'VCSA-80-000281' do
      title 'The vCenter Server must disable or restrict the connectivity between vSAN Health Check and public Hardware Compatibility List (HCL) by use of an external proxy server.'
      desc 'The vSAN Health Check is able to download the HCL from VMware to check compliance against the underlying vSAN Cluster hosts. To ensure the vCenter server is not directly downloading content from the internet, this functionality must be disabled. If this feature is necessary, an external proxy server must be configured.'
      desc 'check', 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Configure >> vSAN >> Internet Connectivity.

    If the HCL internet download is not required, verify "Status" is "Disabled".

    If the "Status" is "Enabled", this is a finding.

    If the HCL internet download is required, verify "Status" is "Enabled" and a proxy host is configured.

    If "Status" is "Enabled" and a proxy is not configured, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Configure >> vSAN >> Internet Connectivity.

    Click "Edit".

    If the HCL internet download is not required, ensure that "Status" is "Disabled".

    If the HCL internet download is required, ensure that "Status" is "Enabled" and that a proxy host is appropriately configured.'
      impact 0.5
      tag check_id: 'C-62688r934500_chk'
      tag severity: 'medium'
      tag gid: 'V-258948'
      tag rid: 'SV-258948r961863_rule'
      tag stig_id: 'VCSA-80-000281'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62597r934501_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      # Get all clusters with vSAN enabled
      clusters = powercli_command('Get-Cluster | Where-Object {$_.VsanEnabled -eq $true} | Sort-Object | Select-Object -ExpandProperty Name').stdout.gsub("\r\n", "\n").split("\n")

      if !clusters.empty?
        command = '$vsanphview = Get-VsanView -Id VsanPhoneHomeSystem-vsan-phonehome-system; $vsanphview.QueryVsanCloudHealthStatus().InternetConnectivity'
        vcinternetenabled = powercli_command(command).stdout.strip

        if vcinternetenabled == 'True'
          proxycommand = '$vsanhealthview = Get-VsanView -Id VsanVcClusterHealthSystem-vsan-cluster-health-system; $vsanhealthview.VsanHealthQueryVsanProxyConfig().Host'
          describe powercli_command(proxycommand) do
            its('stdout.strip') { should_not cmp '' }
          end
        else
          describe 'Enable Internet access for all vSAN clusters.' do
            subject { vcinternetenabled }
            it { should cmp 'false' }
          end
        end
      else
        impact 0.0
        describe 'No clusters with vSAN enabled found. This is not applicable.' do
          skip 'No clusters with vSAN enabled found. This is not applicable.'
        end
      end
    end
- id: VCSA-80-000282
  title: The vCenter Server must configure the vSAN Datastore name to a unique name.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): vSAN datastore unique name; no catalog key'
  _inspec_source: |-
    control 'VCSA-80-000282' do
      title 'The vCenter Server must configure the vSAN Datastore name to a unique name.'
      desc 'A vSAN Datastore name by default is "vsanDatastore". If more than one vSAN cluster is present in vCenter, both datastores will have the same name by default, potentially leading to confusion and manually misplaced workloads.'
      desc 'check', 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Datastores.

    Review the datastores and identify any datastores with "vSAN" as the datastore type.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    If($(Get-Cluster | where {$_.VsanEnabled} | Measure).Count -gt 0){
    Write-Host "vSAN Enabled Cluster found"
    Get-Cluster | where {$_.VsanEnabled} | Get-Datastore | where {$_.type -match "vsan"}
    }
    else{
    Write-Host "vSAN is not enabled, this finding is not applicable."
    }

    If vSAN is enabled and a datastore is named "vsanDatastore", this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Datastores.

    Right-click on the datastore named "vsanDatastore" and select "Rename".

    Rename the datastore based on site-specific naming standards.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the following commands:

    If($(Get-Cluster | where {$_.VsanEnabled} | Measure).Count -gt 0){
    Write-Host "vSAN Enabled Cluster found"
    $Clusters = Get-Cluster | where {$_.VsanEnabled}
    Foreach ($clus in $clusters){
     $clus | Get-Datastore | where {$_.type -match "vsan"} | Set-Datastore -Name $(($clus.name) + "_vSAN_Datastore")
    }
    }
    else{
    Write-Host "vSAN is not enabled, this finding is not applicable."
    }'
      impact 0.5
      tag check_id: 'C-62689r934503_chk'
      tag severity: 'medium'
      tag gid: 'V-258949'
      tag rid: 'SV-258949r961863_rule'
      tag stig_id: 'VCSA-80-000282'
      tag gtitle: 'SRG-APP-000516'
      tag fix_id: 'F-62598r934504_fix'
      tag cci: ['CCI-000366']
      tag nist: ['CM-6 b']

      command = 'Get-Cluster | Where-Object {$_.VsanEnabled} | Get-Datastore | Where-Object {$_.type -match "vsan"} | Select-Object -ExpandProperty Name'
      vsandatastores = powercli_command(command).stdout.strip.gsub("\r\n", "\n").split("\n")

      if vsandatastores.empty?
        impact 0.0
        describe 'No clusters with vSAN enabled found. This is not applicable.' do
          skip 'No clusters with vSAN enabled found. This is not applicable.'
        end
      else
        vsandatastores.each do |ds|
          describe '' do
            subject { ds }
            it { should_not cmp 'vsanDatastore' }
          end
        end
      end
    end
- id: VCSA-80-000283
  title: The vCenter Server must disable Username/Password and Windows Integrated Authentication.
  cat: 2
  verified: false
  check_method: manual
  notes: 'out of native scope (no_native_key): SSO Password/Windows auth disabled via auth policy; no
    catalog key'
  _inspec_source: |-
    control 'VCSA-80-000283' do
      title 'The vCenter Server must disable Username/Password and Windows Integrated Authentication.'
      desc 'All forms of authentication other than Common Access Card (CAC) must be disabled. Password authentication can be temporarily reenabled for emergency access to the local Single Sign-On (SSO) accounts or Active Directory user/pass accounts, but it must be disabled as soon as CAC authentication is functional.'
      desc 'check', 'If a federated identity provider is configured and used for an identity source, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider >> Smart Card Authentication.

    Under "Authentication method", examine the allowed methods.

    If "Smart card authentication" is not enabled and "Password and windows session authentication" is not disabled, this is a finding.'
      desc 'fix', 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >> Identity Provider >> Smart Card Authentication.

    Next to "Authentication method", click "Edit".

    Select to radio button to "Enable smart card authentication".

    Click "Save".

    To re-enable password authentication for troubleshooting purposes, run the following command on the vCenter Server Appliance:

    # /opt/vmware/bin/sso-config.sh -set_authn_policy -pwdAuthn true -winAuthn false -certAuthn false -securIDAuthn false -t vsphere.local'
