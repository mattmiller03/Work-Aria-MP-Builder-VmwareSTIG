# VMware vSphere 8.0 Virtual Machine STIG — V2R3
# Triaged from real InSpec baseline. Collected by vCommunity onto native
# VirtualMachine objects (Properties > Configuration).
benchmark:
  id: vsphere-8.0-vm
  title: VMware vSphere 8.0 Virtual Machine STIG
  version: V2R3
  status: stig
  applies_to: ["8.0"]
  target_kind: STIG_VM

rules:
  - id: VMCH-80-000189
    title: "Copy operations must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.tools.copy.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000191
    title: "Drag and drop operations must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.tools.dnd.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000192
    title: "Paste operations must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.tools.paste.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000193
    title: "Virtual disk shrinking must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.tools.diskShrink.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000194
    title: "Virtual disk wiping must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.tools.diskWiper.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000195
    title: "Limit console sharing"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "RemoteDisplay.maxConnections" }
    operator: equals
    expected: "1"
    default_when_absent: open
    verified: true
  - id: VMCH-80-000196
    title: "Limit informational messages to the VMX file"
    cat: 3
    check_method: vm_advanced_setting
    check: { key: "tools.setinfo.sizeLimit" }
    operator: equals
    expected: "1048576"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000197
    title: "Prevent unauthorized device connection or modification"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "isolation.device.connectable.disable" }
    operator: equals
    expected: "true"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000198
    title: "Prevent VM from obtaining host info from hypervisor"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "tools.guestlib.enableHostInfo" }
    operator: equals
    expected: "false"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000199
    title: "Shared salt values must be disabled"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "sched.mem.pshare.salt" }
    operator: absent
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000200
    title: "Disable access through the dvfilter network API"
    cat: 2
    check_method: vm_advanced_setting
    check: { key: "ethernet0.filter1.name" }
    operator: absent
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000201
    title: "Lock when last console connection closed"
    cat: 3
    check_method: vm_advanced_setting
    check: { key: "tools.guest.desktop.autolock" }
    operator: equals
    expected: "true"
    default_when_absent: open
    verified: true
  - id: VMCH-80-000202
    title: "Disable 3D features when not required"
    cat: 3
    check_method: vm_advanced_setting
    check: { key: "mks.enable3d" }
    operator: equals
    expected: "false"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000203
    title: "Enable encryption for vMotion"
    cat: 2
    check_method: manual
    verified: false
    notes: "VM config property, not an advanced parameter — not collected by vCommunity default config. Add via custom vm_configuration config file to automate."
  - id: VMCH-80-000204
    title: "Enable encryption for Fault Tolerance"
    cat: 2
    check_method: manual
    verified: false
    notes: "VM config property, not an advanced parameter — not collected by vCommunity default config. Add via custom vm_configuration config file to automate."
  - id: VMCH-80-000205
    title: "Configure log size"
    cat: 3
    check_method: vm_advanced_setting
    check: { key: "log.rotateSize" }
    operator: equals
    expected: "2048000"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000206
    title: "Configure log retention"
    cat: 3
    check_method: vm_advanced_setting
    check: { key: "log.keepOld" }
    operator: equals
    expected: "10"
    default_when_absent: notafinding
    verified: true
  - id: VMCH-80-000207
    title: "Enable logging"
    cat: 2
    check_method: manual
    verified: false
    notes: "VM config property, not an advanced parameter — not collected by vCommunity default config. Add via custom vm_configuration config file to automate."
  - id: VMCH-80-000208
    title: "Must not use independent nonpersistent disks"
    cat: 2
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000209
    title: "Remove unneeded floppy devices"
    cat: 3
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000210
    title: "Remove unneeded CD/DVD devices"
    cat: 3
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000211
    title: "Remove unneeded parallel devices"
    cat: 3
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000212
    title: "Remove unneeded serial devices"
    cat: 3
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000213
    title: "Remove unneeded USB devices"
    cat: 3
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"
  - id: VMCH-80-000214
    title: "Disable DirectPath I/O when not required"
    cat: 2
    check_method: manual
    verified: false
    notes: "config.hardware.device not collected by vCommunity — attested manually"